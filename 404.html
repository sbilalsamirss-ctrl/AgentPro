  <!-- Favicon -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { readex: ['Readex Pro', 'sans-serif'], cairo: ['Cairo', 'sans-serif'] },
          colors: {
            'samt-cyan': '#00F5D4',
            'samt-blue': '#00BBF9',
            'samt-gold': '#FFD700',
            'samt-dark': '#070A12',
          }
        }
      }
    }
  </script>

  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ═══════════ Cinematic Theme Transitions ═══════════ */
    *, *::before, *::after {
      transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Readex Pro', 'Cairo', sans-serif; overflow-x: hidden; position: relative; }

    /* ═══════════ Dark Mode ═══════════ */
    html.dark body { background-color: #070A12; color: #FFFFFF; }
    html.dark .glass-card {
      background: rgba(14, 23, 46, 0.78); backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.16); color: #FFFFFF;
    }
    html.dark .glass-card:hover {
      border-color: rgba(0, 245, 212, 0.45);
      box-shadow: 0 16px 45px rgba(0,0,0,0.6), 0 0 30px rgba(0, 245, 212, 0.2);
    }
    html.dark .celestial-canvas { opacity: 1; }

    /* ═══════════ Light Mode ═══════════ */
    html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
    html:not(.dark) .glass-card {
      background: #FFFFFF; border: 1px solid #E2E8F0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05); color: #0F172A;
    }
    html:not(.dark) .glass-card:hover { border-color: #00BBF9; box-shadow: 0 12px 35px rgba(0,187,249,0.15); }
    html:not(.dark) .text-slate-300, html:not(.dark) .text-slate-400 { color: #475569 !important; }
    html:not(.dark) .text-white { color: #0F172A !important; }
    html:not(.dark) .celestial-canvas { opacity: 0; }

    /* ═══════════ Celestial Background ═══════════ */
    .celestial-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; transition: opacity 0.8s ease; }
    .stars-layer {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.5px 1.5px at 25% 42%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 47% 8%, rgba(0,245,212,0.8), transparent),
        radial-gradient(2px 2px at 62% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 78% 22%, rgba(0,187,249,0.7), transparent),
        radial-gradient(1.5px 1.5px at 88% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 35% 78%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 55% 88%, rgba(0,245,212,0.6), transparent);
      animation: twinkleStars 4s ease-in-out infinite alternate;
    }
    .stars-layer-2 {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 40% 18%, rgba(0,245,212,0.6), transparent),
        radial-gradient(1px 1px at 58% 72%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 80% 45%, rgba(0,187,249,0.5), transparent),
        radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 68% 12%, rgba(255,255,255,0.6), transparent);
      animation: twinkleStars2 5.5s ease-in-out infinite alternate;
    }
    @keyframes twinkleStars {
      0% { opacity: 0.5; } 30% { opacity: 0.8; } 60% { opacity: 0.45; } 100% { opacity: 0.75; }
    }
    @keyframes twinkleStars2 {
      0% { opacity: 0.7; } 40% { opacity: 0.35; } 70% { opacity: 0.65; } 100% { opacity: 0.4; }
    }
    .nebula-layer { position: absolute; inset: -20%; width: 140%; height: 140%; }
    .nebula-1 {
      position: absolute; width: 600px; height: 600px; top: -5%; right: -8%; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,187,249,0.14) 0%, transparent 70%);
      filter: blur(80px); animation: driftNebula1 35s ease-in-out infinite alternate;
    }
    .nebula-2 {
      position: absolute; width: 500px; height: 500px; bottom: 5%; left: -5%; border-radius: 50%;
      background: radial-gradient(circle, rgba(121,40,202,0.12) 0%, transparent 70%);
      filter: blur(70px); animation: driftNebula2 42s ease-in-out infinite alternate;
    }
    .nebula-3 {
      position: absolute; width: 450px; height: 450px; top: 40%; left: 30%; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,245,212,0.1) 0%, transparent 70%);
      filter: blur(90px); animation: driftNebula3 50s ease-in-out infinite alternate;
    }
    @keyframes driftNebula1 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,30px) scale(1.08); } 100% { transform: translate(20px,-20px) scale(0.95); } }
    @keyframes driftNebula2 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(35px,-25px) scale(1.05); } 100% { transform: translate(-15px,15px) scale(0.97); } }
    @keyframes driftNebula3 { 0% { transform: translate(0,0) scale(1); opacity:0.8; } 50% { transform: translate(-30px,-20px) scale(1.1); opacity:1; } 100% { transform: translate(25px,30px) scale(0.9); opacity:0.7; } }

    /* ═══════════ Glow Button ═══════════ */
    .btn-samt-glow {
      background: linear-gradient(135deg, #00F5D4 0%, #00BBF9 100%);
      color: #070A12 !important; font-weight: 800;
      box-shadow: 0 0 25px rgba(0,245,212,0.45);
    }
    .btn-samt-glow:hover {
      box-shadow: 0 0 40px rgba(0,245,212,0.65);
      transform: translateY(-2px);
    }

    /* ═══════════ Glass Outline Button ═══════════ */
    .btn-glass-outline {
      border: 1.5px solid rgba(0,245,212,0.4);
      background: rgba(14, 23, 46, 0.3);
      backdrop-filter: blur(10px);
      color: #00F5D4;
      font-weight: 700;
    }
    .btn-glass-outline:hover {
      border-color: rgba(0,245,212,0.7);
      box-shadow: 0 0 25px rgba(0,245,212,0.2);
      transform: translateY(-2px);
    }
    html:not(.dark) .btn-glass-outline {
      border-color: #00BBF9;
      background: rgba(0,187,249,0.06);
      color: #0077B6;
    }
    html:not(.dark) .btn-glass-outline:hover {
      border-color: #00BBF9;
      box-shadow: 0 0 20px rgba(0,187,249,0.15);
    }

    /* ═══════════ Gradient Text ═══════════ */
    .text-gradient {
      background: linear-gradient(135deg, #00F5D4 0%, #00BBF9 50%, #7928CA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ═══════════ Floating Astrolabe ═══════════ */
    .floating-astrolabe {
      animation: floatAstrolabe 6s ease-in-out infinite;
    }
    @keyframes floatAstrolabe {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(5deg); }
      50% { transform: translateY(-6px) rotate(0deg); }
      75% { transform: translateY(-14px) rotate(-5deg); }
    }

    .astrolabe-spin {
      animation: astrolabeSpin 30s linear infinite;
    }
    @keyframes astrolabeSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ═══════════ Pulse glow ring ═══════════ */
    .pulse-ring {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ═══════════ Celestial Background ═══════════ -->
  <div class="celestial-canvas" aria-hidden="true">
    <div class="stars-layer"></div>
    <div class="stars-layer-2"></div>
    <div class="nebula-layer">
      <div class="nebula-1"></div>
      <div class="nebula-2"></div>
      <div class="nebula-3"></div>
    </div>
  </div>

  <!-- ═══════════ Navbar ═══════════ -->
  <nav class="relative z-10 w-full py-4 px-6 md:px-12">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <!-- Logo & Brand -->
      <a href="./index.html" class="flex items-center gap-3 group">
        <div class="relative w-9 h-9">
          <svg viewBox="0 0 100 100" class="w-full h-full text-samt-cyan">
            <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 3" opacity="0.6"/>
            <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="50" y1="6" x2="50" y2="94" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <line x1="6" y1="50" x2="94" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="6" fill="#00BBF9"/>

      </a>

      <!-- Theme Toggle -->
      <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center glass-card cursor-pointer hover:scale-110 transition-transform" aria-label="تبديل السمة">

  </nav>

  <!-- ═══════════ 404 Content ═══════════ -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-6">

      <p class="text-slate-400 text-lg md:text-xl font-cairo leading-relaxed mb-10 max-w-xl mx-auto">
        يبدو أنك وصلت إلى نقطة خارج مدار سمت! الصفحة التي تبحث عنها غير متوفرة.
      </p>

      <!-- Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-14">
        <a href="./index.html" class="btn-samt-glow px-8 py-3.5 rounded-xl text-lg font-cairo inline-flex items-center gap-2 transition-all duration-300">
          <i class="fa-solid fa-home"></i>

      <!-- Floating Astrolabe SVG -->
      <div class="floating-astrolabe mx-auto w-36 h-36 md:w-44 md:h-44 relative">
        <!-- Outer pulse ring -->
        <div class="pulse-ring absolute inset-0 rounded-full border-2 border-samt-cyan/20"></div>

        <svg viewBox="0 0 200 200" class="w-full h-full astrolabe-spin" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer dashed ring -->
          <circle cx="100" cy="100" r="90" fill="none" stroke="#00F5D4" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
          <!-- Second ring -->
          <circle cx="100" cy="100" r="75" fill="none" stroke="#00BBF9" stroke-width="1.5" opacity="0.5"/>
          <!-- Third ring -->
          <circle cx="100" cy="100" r="55" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.35"/>
          <!-- Cross lines -->
          <line x1="100" y1="10" x2="100" y2="190" stroke="#00F5D4" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
          <line x1="10" y1="100" x2="190" y2="100" stroke="#00F5D4" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
          <!-- Diagonal lines -->
          <line x1="30" y1="30" x2="170" y2="170" stroke="#00BBF9" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
          <line x1="170" y1="30" x2="30" y2="170" stroke="#00BBF9" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
          <!-- Inner decorative ring -->
          <circle cx="100" cy="100" r="35" fill="none" stroke="#7928CA" stroke-width="1" opacity="0.3" stroke-dasharray="4 3"/>
          <!-- Center dot -->
          <circle cx="100" cy="100" r="8" fill="#00BBF9" opacity="0.7"/>
          <circle cx="100" cy="100" r="4" fill="#00F5D4"/>
          <!-- Orbital dots -->
          <circle cx="100" cy="25" r="3" fill="#00F5D4" opacity="0.6"/>
          <circle cx="175" cy="100" r="3" fill="#00BBF9" opacity="0.5"/>
          <circle cx="100" cy="175" r="3" fill="#00F5D4" opacity="0.6"/>
          <circle cx="25" cy="100" r="3" fill="#00BBF9" opacity="0.5"/>
          <!-- Small stars on the ring -->
          <circle cx="155" cy="40" r="2" fill="#FFFFFF" opacity="0.4"/>
          <circle cx="45" cy="155" r="2" fill="#FFFFFF" opacity="0.3"/>
          <circle cx="160" cy="155" r="2" fill="#FFFFFF" opacity="0.35"/>
        </svg>
      </div>

    </div>
  </main>

  <!-- ═══════════ Minimal Footer ═══════════ -->
  <footer class="bg-slate-50 dark:bg-black/50 border-t border-slate-200 dark:border-white/10 py-6 text-center relative z-10">
    <p class="text-slate-500 dark:text-slate-400 text-sm font-cairo">
      © 2026 <strong class="text-slate-800 dark:text-white">سمت SAMT</strong> — جميع الحقوق محفوظة
    </p>
  </footer>

  <!-- ═══════════ Theme Toggle JS ═══════════ -->
  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      if (theme === 'light') { htmlEl.classList.remove('dark'); themeIcon.className = 'fa-solid fa-moon text-samt-blue text-base'; }
      else { htmlEl.classList.add('dark'); themeIcon.className = 'fa-solid fa-sun text-samt-gold text-base'; }
      localStorage.setItem('samt_theme', theme);
    }
    applyTheme(localStorage.getItem('samt_theme') || 'dark');
    themeToggle.addEventListener('click', () => { applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark'); });
  </script>

</body>
</html>
