  <style>
    *, *::before, *::after {
      transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Readex Pro', 'Cairo', sans-serif; overflow-x: hidden; }

    html.dark body { background-color: #070A12; color: #FFFFFF; }
    html.dark .glass-card {
      background: rgba(14, 23, 46, 0.78); backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.16); color: #FFFFFF;
    }
    html.dark .glass-card:hover {
      border-color: rgba(0, 245, 212, 0.45);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 245, 212, 0.2);
    }
    html.dark .celestial-canvas { opacity: 1; }

    html:not(.dark) body {
      background-color: #F8FAFC;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 187, 249, 0.08), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(121, 40, 202, 0.05), transparent 40%);
      color: #0F172A;
    }
    html:not(.dark) .glass-card {
      background: #FFFFFF; border: 1px solid #E2E8F0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); color: #0F172A;
    }
    html:not(.dark) .glass-card:hover {
      border-color: #00BBF9;
      box-shadow: 0 12px 35px rgba(0, 187, 249, 0.15);
    }
    html:not(.dark) .text-slate-300, html:not(.dark) .text-slate-400 { color: #475569 !important; }
    html:not(.dark) .text-white { color: #0F172A !important; }
    html:not(.dark) .celestial-canvas { opacity: 0; }

    /* ==========================================================================
       ✨ Celestial Animated Background Layers
       ========================================================================== */
    .celestial-canvas {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    /* ⭐ Twinkling Stars Layer */
    .stars-layer {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.5px 1.5px at 25% 42%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 47% 8%, rgba(0,245,212,0.8), transparent),
        radial-gradient(2px 2px at 62% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 78% 22%, rgba(0,187,249,0.7), transparent),
        radial-gradient(1.5px 1.5px at 88% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 35% 78%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 55% 88%, rgba(0,245,212,0.6), transparent);
      animation: twinkleStars 4s ease-in-out infinite alternate;
    }
    .stars-layer-2 {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 40% 18%, rgba(0,245,212,0.6), transparent),
        radial-gradient(1px 1px at 58% 72%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 80% 45%, rgba(0,187,249,0.5), transparent),
        radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 68% 12%, rgba(255,255,255,0.6), transparent);
      animation: twinkleStars2 5.5s ease-in-out infinite alternate;
    }

    @keyframes twinkleStars {
      0%   { opacity: 0.5; }
      30%  { opacity: 0.8; }
      60%  { opacity: 0.45; }
      100% { opacity: 0.75; }
    }
    @keyframes twinkleStars2 {
      0%   { opacity: 0.7; }
      40%  { opacity: 0.35; }
      70%  { opacity: 0.65; }
      100% { opacity: 0.4; }
    }

    /* 🌫️ Drifting Nebulae Layer */
    .nebula-layer {
      position: absolute; inset: -20%; width: 140%; height: 140%;
    }
    .nebula-1 {
      position: absolute;
      width: 600px; height: 600px;
      top: -5%; right: -8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 187, 249, 0.14) 0%, transparent 70%);
      filter: blur(80px);
      animation: driftNebula1 35s ease-in-out infinite alternate;
    }
    .nebula-2 {
      position: absolute;
      width: 500px; height: 500px;
      bottom: 5%; left: -5%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(121, 40, 202, 0.12) 0%, transparent 70%);
      filter: blur(70px);
      animation: driftNebula2 42s ease-in-out infinite alternate;
    }
    .nebula-3 {
      position: absolute;
      width: 450px; height: 450px;
      top: 40%; left: 30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.1) 0%, transparent 70%);
      filter: blur(90px);
      animation: driftNebula3 50s ease-in-out infinite alternate;
    }

    @keyframes driftNebula1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-40px, 30px) scale(1.08); }
      100% { transform: translate(20px, -20px) scale(0.95); }
    }
    @keyframes driftNebula2 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(35px, -25px) scale(1.05); }
      100% { transform: translate(-15px, 15px) scale(0.97); }
    }
    @keyframes driftNebula3 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.8; }
      50%  { transform: translate(-30px, -20px) scale(1.1); opacity: 1; }
      100% { transform: translate(25px, 30px) scale(0.9); opacity: 0.7; }
    }

    .btn-samt-glow {
      background: linear-gradient(135deg, #00F5D4 0%, #00BBF9 100%);
      color: #070A12 !important; font-weight: 800;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
    }
    .text-gradient {
      background: linear-gradient(135deg, #00BBF9 0%, #00F5D4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Force dark footer text colors in all modes */
    footer, footer a { color: #94A3B8 !important; }
    footer a:hover { color: #00F5D4 !important; }
    footer strong { color: #FFFFFF !important; }
  
    /* 🌓 CSS-Driven Theme Toggle Icon (Prevents Flashing) */
    .theme-toggle-icon::before {
      display: inline-block;
      font-style: normal;
      font-variant: normal;
      text-rendering: auto;
      -webkit-font-smoothing: antialiased;
    }
    html.dark .theme-toggle-icon::before {
      content: "\f185" !important; /* Sun icon */
    }
    html.dark .theme-toggle-icon {
      color: #FFB703 !important; /* gold */
    }
    html:not(.dark) .theme-toggle-icon::before {
      content: "\f186" !important; /* Moon icon */
    }
    html:not(.dark) .theme-toggle-icon {
      color: #00BBF9 !important; /* cyan/blue */
    }

  </style>

  <script>
    // Theme Engine (Smooth Cinematic Fade)
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
        function applyTheme(theme, animate = false) {
      if (animate && themeIcon) {
        themeIcon.classList.add('theme-icon-rotate');
        setTimeout(() => themeIcon.classList.remove('theme-icon-rotate'), 500);
      }

      if (theme === 'light') {
        htmlEl.classList.remove('dark');
      } else {
        htmlEl.classList.add('dark');
      }
      localStorage.setItem('samt_theme', theme);
    }

    const savedTheme = localStorage.getItem('samt_theme') || 'dark';
    applyTheme(savedTheme, false);

    themeToggle.addEventListener('click', () => {
      applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark', true);
    });

    // Course Catalog Engine
    document.addEventListener('DOMContentLoaded', () => {
      // تنظيف تلقائي إجباري لأي بيانات وهمية قديمة
      try {
        if (localStorage.getItem('samt_v2026_clean_slate') !== 'true') {
          localStorage.removeItem('samt_admin_courses');
          localStorage.removeItem('samt_admin_releases');
          localStorage.removeItem('samt_subscribers');
          localStorage.setItem('samt_v2026_clean_slate', 'true');
        }
      } catch(e) {}

      const grid = document.getElementById('coursesGrid');
      const searchInput = document.getElementById('courseSearch');
      const filterBtns = document.querySelectorAll('.filter-btn');
      let currentCategory = 'all';
      let searchTerm = '';
      const courses = JSON.parse(localStorage.getItem('samt_admin_courses')) || window.AgentProData?.courses || [];
      const isAdmin = window.SamtAuth?.isAdmin();

      function getProgress(courseId, totalLessons = 3) {
        try {
          const completed = JSON.parse(localStorage.getItem('samt_completed_' + courseId) || '[]');
          return Math.round((completed.length / totalLessons) * 100);
        } catch (e) { return 0; }
      }

      function extractYoutubeThumbnail(url) {
        if (!url) return '';
        let videoId = '';
        if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
        else if (url.includes('v=')) videoId = url.split('v=')[1]?.split('&')[0];
        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
      }

      function render() {
        let list = courses;
        if (currentCategory !== 'all') list = list.filter(c => c.category === currentCategory);
        if (searchTerm.trim() !== '') {
          const q = searchTerm.toLowerCase();
          list = list.filter(c => c.title.toLowerCase().includes(q) || (c.description && c.description.toLowerCase().includes(q)) || (c.categoryName && c.categoryName.toLowerCase().includes(q)));
        }

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-16 glass-card rounded-2xl border border-white/10">
              <div class="w-16 h-16 rounded-2xl bg-samt-cyan/10 border border-samt-cyan/30 text-samt-cyan text-2xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <h3 class="text-base font-bold mb-1 font-cairo text-white">لا توجد كورسات منشورة حالياً</h3>
              <p class="text-xs text-slate-400">سيتم إدراج الكورسات والدروس التدريبية فور إضافتها من قبل المشرف.</p>
              ${isAdmin ? `
                <button onclick="window.location.href='./course-builder.html'" class="btn-samt-glow mt-4 px-6 py-2.5 rounded-xl text-xs font-bold inline-flex items-center gap-2">
                  <i class="fa-solid fa-plus"></i>
                  <span>إضافة أول كورس الآن</span>
                </button>
              ` : ''}
            </div>
          `;
          return;
        }

        grid.innerHTML = list.map(c => {
          // Calculate real lesson count
          let totalLessons = 0;
          let totalSections = 0;
          if (c.sections && c.sections.length > 0) {
            totalSections = c.sections.length;
            c.sections.forEach(s => totalLessons += (s.lectures || []).length);
          } else if (c.lessons && c.lessons.length > 0) {
            totalLessons = c.lessons.length;
          } else {
            totalLessons = 1;
          }

          const progress = getProgress(c.id, totalLessons);
          const thumb = c.thumbnail || extractYoutubeThumbnail(c.promoVideoUrl || c.videoUrl);
          
          // Inline Admin Action Buttons
          const adminControls = isAdmin ? `
            <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 bg-black/80 backdrop-blur-md p-1.5 rounded-xl border border-samt-gold/40 shadow-lg">
              <button onclick="event.preventDefault(); event.stopPropagation(); window.location.href='./course-builder.html?edit=${c.id}'" title="تعديل هذا الكورس" class="w-7 h-7 rounded-lg bg-samt-gold/20 hover:bg-samt-gold/40 text-samt-gold flex items-center justify-center text-xs transition-colors">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="event.preventDefault(); event.stopPropagation(); deleteCourseInline('${c.id}')" title="حذف هذا الكورس" class="w-7 h-7 rounded-lg bg-rose-500/20 hover:bg-rose-500/40 text-rose-400 flex items-center justify-center text-xs transition-colors">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          ` : '';

          return `
            <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between group relative transition-all">
              ${adminControls}
              <div class="relative aspect-video bg-gradient-to-br from-[#0B152E] to-[#16254A] flex items-center justify-center overflow-hidden">
                ${thumb ? `<img src="${thumb}" alt="${c.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80 group-hover:opacity-100" />` : ''}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                <div class="absolute w-14 h-14 rounded-full bg-samt-cyan/90 text-samt-space flex items-center justify-center text-xl shadow-xl group-hover:scale-110 transition-transform">
                  <i class="fa-solid fa-play ml-0.5"></i>
                </div>
                <span class="absolute top-3 right-3 px-2.5 py-1 text-[11px] font-bold rounded-full bg-black/70 text-samt-cyan border border-samt-cyan/30 backdrop-blur-md z-10">
                  ${c.level || 'كورس معتمد'}
                </span>
                ${c.duration ? `
                  <span class="absolute bottom-3 left-3 px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-black/80 text-white z-10">
                    <i class="fa-regular fa-clock ml-1"></i>${c.duration}
                  </span>
                ` : ''}
              </div>
              <div class="p-5 flex flex-col flex-grow text-right">
                <div class="flex items-center justify-between text-xs text-samt-cyan font-bold mb-1.5">
                  <span>${c.categoryName || 'شروحات عامة'}</span>
                  <span class="text-slate-400 text-[11px]"><i class="fa-solid fa-book-bookmark ml-1"></i>${totalSections > 0 ? totalSections + ' أقسام • ' : ''}${totalLessons} درس</span>
                </div>
                <h3 class="text-base font-bold mb-1 leading-snug font-cairo">${c.title}</h3>
                ${c.subtitle ? `<p class="text-slate-500 text-[11px] mb-2">${c.subtitle}</p>` : ''}
                <p class="text-slate-400 text-xs leading-relaxed mb-4 line-clamp-2">${c.description || ''}</p>
                ${c.instructorName ? `<div class="text-[10px] text-slate-500 mb-3"><i class="fa-solid fa-user-tie ml-1"></i>${c.instructorName}</div>` : ''}
                <div class="mt-auto pt-3 border-t border-white/10 mb-4">
                  <div class="flex items-center justify-between text-[11px] font-bold mb-1">
                    <span class="text-slate-400">نسبة التقدم:</span>
                    <span class="${progress === 100 ? 'text-emerald-400' : 'text-samt-cyan'}">${progress}%</span>
                  </div>
                  <div class="w-full h-1.5 bg-black/40 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-samt-cyan to-samt-blue rounded-full" style="width:${progress}%"></div>
                  </div>
                </div>
                <a href="./course-view.html?id=${c.id}" class="w-full py-2.5 rounded-xl bg-samt-cyan text-samt-space hover:opacity-90 text-xs font-black flex items-center justify-center gap-2">
                  <i class="fa-solid fa-graduation-cap"></i>
                  <span>${progress > 0 ? 'متابعة التعلم (' + progress + '%)' : 'بدء دراسة الكورس'}</span>
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      // Admin delete inline
      window.deleteCourseInline = function(id) {
        if (confirm('تأكيد حذف الكورس؟')) {
          const idx = courses.findIndex(c => c.id === id);
          if (idx !== -1) courses.splice(idx, 1);
          localStorage.setItem('samt_admin_courses', JSON.stringify(courses));
          try { if (window.SamtFB && window.SamtFB.available && window.SamtFB.isAdmin()) window.SamtFB.syncCoursesToCloud(courses); } catch(e){}
          render();
        }
      };

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => { b.classList.remove('bg-samt-cyan', 'text-samt-space'); b.classList.add('glass-card', 'text-slate-400'); });
          btn.classList.remove('glass-card', 'text-slate-400');
          btn.classList.add('bg-samt-cyan', 'text-samt-space');
          currentCategory = btn.dataset.category;
          render();
        });
      });
      searchInput?.addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
      render();
    });
  </script>
</body>
</html>
