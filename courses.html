<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أكاديمية سمت SAMT | منصة الكورسات والدروس التفاعلية</title>
  <meta name="description" content="أكاديمية سمت SAMT - دورات تدريبية متقدمة في البرمجيات والإنتاجية وتحليلات البيانات." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            samt: {
              space: '#070A12', navy: '#0B132B', card: '#0E172E',
              cyan: '#00F5D4', blue: '#00BBF9', purple: '#7928CA', gold: '#FFB703',
              border: 'rgba(0, 245, 212, 0.18)'
            }
          },
          fontFamily: {
            readex: ['"Readex Pro"', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', '"Readex Pro"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after {
      transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Readex Pro', 'Cairo', sans-serif; overflow-x: hidden; }

    /* 🌌 Dark Mode */
    html.dark body {
      background-color: #070A12;
      background-image:
        radial-gradient(circle at 50% 12%, rgba(0, 187, 249, 0.14), transparent 48%),
        radial-gradient(circle at 85% 30%, rgba(121, 40, 202, 0.12), transparent 42%),
        radial-gradient(circle at 15% 60%, rgba(0, 245, 212, 0.1), transparent 38%),
        radial-gradient(2px 2px at 25px 35px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 100px 90px, rgba(0, 245, 212, 0.8), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 180px 160px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 260px 200px, rgba(0, 187, 249, 0.7), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 340px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 440px 300px, rgba(0, 245, 212, 0.6), rgba(0,0,0,0));
      background-size: 100% 100%, 100% 100%, 100% 100%, 450px 450px, 450px 450px, 450px 450px, 450px 450px, 450px 450px, 450px 450px;
      color: #FFFFFF;
    }
    html.dark .glass-card {
      background: rgba(14, 23, 46, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.16);
      color: #FFFFFF;
    }
    html.dark .glass-card:hover {
      border-color: rgba(0, 245, 212, 0.45);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 25px rgba(0, 245, 212, 0.18);
    }

    /* ☀️ Light Mode */
    html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
    html:not(.dark) .glass-card {
      background: #FFFFFF; border: 1px solid #E2E8F0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05); color: #0F172A;
    }
    html:not(.dark) .glass-card:hover { border-color: #00BBF9; box-shadow: 0 12px 35px rgba(0, 187, 249, 0.15); }
    html:not(.dark) .text-slate-400 { color: #475569 !important; }
    html:not(.dark) .text-white { color: #0F172A !important; }

    .btn-samt-glow {
      background: linear-gradient(135deg, #00F5D4 0%, #00BBF9 100%);
      color: #070A12 !important; font-weight: 800;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
    }
    .text-gradient {
      background: linear-gradient(135deg, #00BBF9 0%, #00F5D4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-3">
        <div class="relative w-9 h-9">
          <svg viewBox="0 0 100 100" class="w-full h-full text-samt-cyan">
            <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 3" opacity="0.6"/>
            <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="50" y1="6" x2="50" y2="94" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <line x1="6" y1="50" x2="94" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="6" fill="#00BBF9"/>
            <circle cx="85" cy="50" r="4" fill="#00F5D4"/>
          </svg>
        </div>
        <span class="text-2xl font-black font-cairo">سَـمْـت</span>
        <span class="text-xl font-extrabold text-samt-cyan font-readex">SAMT</span>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="./index.html" class="text-sm font-semibold hover:text-samt-cyan">الرئيسية</a>
        <a href="./courses.html" class="text-sm font-bold text-samt-cyan">أكاديمية الكورسات</a>
        <a href="./downloads.html" class="text-sm font-semibold hover:text-samt-cyan">مركز التحميل</a>
      </nav>
      <div class="flex items-center gap-3">
        <button id="themeToggle" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-sm">
          <i id="themeIcon" class="fa-solid fa-sun text-samt-gold text-base"></i>
        </button>
        <div class="samt-auth-slot"></div>
        <a href="./downloads.html" class="hidden sm:flex btn-samt-glow px-4 py-2 rounded-full text-xs font-bold">تحميل البرامج</a>
      </div>
    </div>
  </header>

  <!-- Courses Hero & Filter -->
  <main class="pt-32 pb-20 max-w-7xl mx-auto px-4 w-full">
    
    <div class="text-center max-w-3xl mx-auto mb-12">
      <span class="text-xs font-bold text-samt-cyan px-3 py-1 rounded-full glass-card border border-samt-cyan/30">
        🎓 منصة التعليم التفاعلية
      </span>
      <h1 class="text-3xl sm:text-5xl font-black mt-4 mb-4 font-cairo">
        دورات <span class="text-gradient">سمت SAMT</span> التدريبية
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        اختر مسارك التعليمي، تابع دروس الفيديو، وحمّل ملفات التطبيق وقوالب العمل مباشرة.
      </p>

      <div class="relative max-w-xl mx-auto mt-8">
        <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="courseSearch" placeholder="ابحث باسم الكورس أو الموضوع..." class="w-full glass-card border border-white/15 focus:border-samt-cyan text-sm rounded-full py-3.5 pr-11 pl-4 outline-none" />
      </div>

      <div class="flex items-center justify-center gap-2 flex-wrap mt-6">
        <button class="filter-btn active px-4 py-2 rounded-full text-xs font-bold bg-samt-cyan text-samt-space" data-category="all">جميع الكورسات</button>
        <button class="filter-btn px-4 py-2 rounded-full text-xs font-bold glass-card text-slate-400 hover:text-white" data-category="basics">دليل المبتدئين</button>
        <button class="filter-btn px-4 py-2 rounded-full text-xs font-bold glass-card text-slate-400 hover:text-white" data-category="productivity">الإنتاجية والتنظيم</button>
        <button class="filter-btn px-4 py-2 rounded-full text-xs font-bold glass-card text-slate-400 hover:text-white" data-category="analytics">التحليلات والـ KPIs</button>
        <button class="filter-btn px-4 py-2 rounded-full text-xs font-bold glass-card text-slate-400 hover:text-white" data-category="database">قواعد البيانات</button>
      </div>
    </div>

    <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="bg-black/50 border-t border-white/10 py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>&copy; 2026 <strong>أكاديمية سمت SAMT</strong>. جميع الحقوق محفوظة.</div>
      <div class="flex items-center gap-4">
        <a href="./index.html" class="text-slate-400 hover:text-white">الرئيسية</a>
        <a href="./downloads.html" class="text-slate-400 hover:text-white">مركز التحميل</a>
      </div>
    </div>
  </footer>

  <script src="./assets/js/courses-data.js"></script>
  <script src="./assets/js/auth.js"></script>

  <script>
    // Theme Engine (Smooth Cinematic Fade)
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      if (theme === 'light') {
        htmlEl.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon text-samt-blue text-base';
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun text-samt-gold text-base';
      }
      localStorage.setItem('samt_theme', theme);
    }
    applyTheme(localStorage.getItem('samt_theme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark');
    });

    // Course Catalog Engine
    document.addEventListener('DOMContentLoaded', () => {
      // تنظيف تلقائي لأي بيانات وهمية قديمة
      try {
        const stored = localStorage.getItem('samt_admin_courses');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.some(c => (c.videoUrl && c.videoUrl.includes('dQw4w9WgXcQ')) || c.id === 'course-01' || c.id === 'course-02')) {
            localStorage.removeItem('samt_admin_courses');
          }
        }
      } catch(e) {}

      const grid = document.getElementById('coursesGrid');
      const searchInput = document.getElementById('courseSearch');
      const filterBtns = document.querySelectorAll('.filter-btn');
      let currentCategory = 'all';
      let searchTerm = '';
      const courses = JSON.parse(localStorage.getItem('samt_admin_courses')) || window.AgentProData?.courses || [];
      const isAdmin = window.SamtAuth?.isAdmin();

      function getProgress(courseId, totalLessons = 3) {
        try {
          const completed = JSON.parse(localStorage.getItem('samt_completed_' + courseId) || '[]');
          return Math.round((completed.length / totalLessons) * 100);
        } catch (e) { return 0; }
      }

      function extractYoutubeThumbnail(url) {
        if (!url) return '';
        let videoId = '';
        if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
        else if (url.includes('v=')) videoId = url.split('v=')[1]?.split('&')[0];
        else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
        return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
      }

      function render() {
        let list = courses;
        if (currentCategory !== 'all') list = list.filter(c => c.category === currentCategory);
        if (searchTerm.trim() !== '') {
          const q = searchTerm.toLowerCase();
          list = list.filter(c => c.title.toLowerCase().includes(q) || (c.description && c.description.toLowerCase().includes(q)) || (c.categoryName && c.categoryName.toLowerCase().includes(q)));
        }

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-16 glass-card rounded-2xl border border-white/10">
              <div class="w-16 h-16 rounded-2xl bg-samt-cyan/10 border border-samt-cyan/30 text-samt-cyan text-2xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <h3 class="text-base font-bold mb-1 font-cairo text-white">لا توجد كورسات منشورة حالياً</h3>
              <p class="text-xs text-slate-400">سيتم إدراج الكورسات والدروس التدريبية فور إضافتها من قبل المشرف.</p>
              ${isAdmin ? `
                <button onclick="window.SamtAuth.openNewCourseInline()" class="btn-samt-glow mt-4 px-6 py-2.5 rounded-xl text-xs font-bold inline-flex items-center gap-2">
                  <i class="fa-solid fa-plus"></i>
                  <span>إضافة أول كورس الآن</span>
                </button>
              ` : ''}
            </div>
          `;
          return;
        }

        grid.innerHTML = list.map(c => {
          const progress = getProgress(c.id, c.lessons ? c.lessons.length : 3);
          const thumb = extractYoutubeThumbnail(c.videoUrl);
          
          // Inline Admin Action Buttons (تظهر فقط عند تسجيل دخول المشرف)
          const adminControls = isAdmin ? `
            <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 bg-black/80 backdrop-blur-md p-1.5 rounded-xl border border-samt-gold/40 shadow-lg">
              <button onclick="window.SamtAuth.editCourseInline('${c.id}')" title="تعديل هذا الكورس" class="w-7 h-7 rounded-lg bg-samt-gold/20 hover:bg-samt-gold/40 text-samt-gold flex items-center justify-center text-xs transition-colors">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="window.SamtAuth.deleteCourseInline('${c.id}')" title="حذف هذا الكورس" class="w-7 h-7 rounded-lg bg-rose-500/20 hover:bg-rose-500/40 text-rose-400 flex items-center justify-center text-xs transition-colors">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          ` : '';

          return `
            <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between group relative transition-all">
              ${adminControls}
              <div class="relative aspect-video bg-gradient-to-br from-[#0B152E] to-[#16254A] flex items-center justify-center overflow-hidden">
                ${thumb ? `<img src="${thumb}" alt="${c.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80 group-hover:opacity-100" />` : ''}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                <div class="absolute w-14 h-14 rounded-full bg-samt-cyan/90 text-samt-space flex items-center justify-center text-xl shadow-xl group-hover:scale-110 transition-transform">
                  <i class="fa-solid fa-play ml-0.5"></i>
                </div>
                <span class="absolute top-3 right-3 px-2.5 py-1 text-[11px] font-bold rounded-full bg-black/70 text-samt-cyan border border-samt-cyan/30 backdrop-blur-md z-10">
                  ${c.level || 'كورس معتمد'}
                </span>
                ${c.duration ? `
                  <span class="absolute bottom-3 left-3 px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-black/80 text-white z-10">
                    <i class="fa-regular fa-clock ml-1"></i>${c.duration}
                  </span>
                ` : ''}
              </div>
              <div class="p-5 flex flex-col flex-grow text-right">
                <div class="flex items-center justify-between text-xs text-samt-cyan font-bold mb-1.5">
                  <span>${c.categoryName || 'شروحات عامة'}</span>
                  <span class="text-slate-400 text-[11px]"><i class="fa-solid fa-book-bookmark ml-1"></i>3 دروس</span>
                </div>
                <h3 class="text-base font-bold mb-2 leading-snug font-cairo">${c.title}</h3>
                <p class="text-slate-400 text-xs leading-relaxed mb-4 line-clamp-2">${c.description || ''}</p>
                <div class="mt-auto pt-3 border-t border-white/10 mb-4">
                  <div class="flex items-center justify-between text-[11px] font-bold mb-1">
                    <span class="text-slate-400">نسبة التقدم:</span>
                    <span class="${progress === 100 ? 'text-emerald-400' : 'text-samt-cyan'}">${progress}%</span>
                  </div>
                  <div class="w-full h-1.5 bg-black/40 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-samt-cyan to-samt-blue rounded-full" style="width:${progress}%"></div>
                  </div>
                </div>
                <a href="./course-view.html?id=${c.id}" class="w-full py-2.5 rounded-xl bg-samt-cyan text-samt-space hover:opacity-90 text-xs font-black flex items-center justify-center gap-2">
                  <i class="fa-solid fa-graduation-cap"></i>
                  <span>${progress > 0 ? 'متابعة التعلم (' + progress + '%)' : 'بدء دراسة الكورس'}</span>
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => { b.classList.remove('bg-samt-cyan', 'text-samt-space'); b.classList.add('glass-card', 'text-slate-400'); });
          btn.classList.remove('glass-card', 'text-slate-400');
          btn.classList.add('bg-samt-cyan', 'text-samt-space');
          currentCategory = btn.dataset.category;
          render();
        });
      });
      searchInput?.addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
      render();
    });
  </script>
</body>
</html>
