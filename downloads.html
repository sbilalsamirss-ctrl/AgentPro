<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مركز تنزيل البرامج والتطبيقات | منظومة سمت SAMT</title>
  <meta name="description" content="تحميل أحدث إصدارات متصفح وتطبيقات منظومة سمت SAMT لأنظمة Windows و macOS وأدوات المطورين." />

  <!-- Google Fonts: Readex Pro & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            samt: {
              space: '#070A12',
              navy: '#0B132B',
              card: '#0E172E',
              cyan: '#00F5D4',
              blue: '#00BBF9',
              purple: '#7928CA',
              gold: '#FFB703',
              border: 'rgba(0, 245, 212, 0.18)'
            }
          },
          fontFamily: {
            readex: ['"Readex Pro"', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', '"Readex Pro"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Readex Pro', 'Cairo', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    html.dark body { background-color: #070A12; color: #FFFFFF; }
    html.dark .glass-card { background: rgba(14, 23, 46, 0.8); border: 1px solid rgba(0, 245, 212, 0.14); color: #FFFFFF; }
    
    html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
    html:not(.dark) .glass-card { background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #0F172A; }
    html:not(.dark) .text-slate-400 { color: #475569 !important; }
    html:not(.dark) .text-white { color: #0F172A !important; }

    .btn-samt-glow {
      background: linear-gradient(135deg, #00F5D4 0%, #00BBF9 100%);
      color: #070A12 !important;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-3">
        <span class="text-2xl font-black font-cairo">سَـمْـت</span>
        <span class="text-xl font-extrabold text-samt-cyan font-readex">SAMT</span>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="./index.html" class="text-sm font-semibold hover:text-samt-cyan">الرئيسية</a>
        <a href="./courses.html" class="text-sm font-semibold hover:text-samt-cyan">أكاديمية الكورسات</a>
        <a href="./downloads.html" class="text-sm font-bold text-samt-cyan">مركز التحميل</a>
      </nav>
      <div class="flex items-center gap-3">
        <button id="themeToggle" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-sm text-samt-gold">
          <i id="themeIcon" class="fa-solid fa-sun"></i>
        </button>
        <div class="samt-auth-slot"></div>
      </div>
    </div>
  </header>

  <main class="pt-32 pb-20 max-w-6xl mx-auto px-4 w-full text-right">
    
    <div class="text-center max-w-2xl mx-auto mb-14">
      <span class="text-xs font-bold text-samt-cyan px-3 py-1 rounded-full glass-card">
        💾 حزم التثبيت الرسمية
      </span>
      <h1 class="text-3xl sm:text-5xl font-black mt-4 mb-3 font-cairo">
        مركز تنزيل <span class="text-samt-cyan">برمجيات سمت</span>
      </h1>
      <p class="text-slate-400 text-sm">
        جميع البرامج خفيفة، آمنة ومحدثة بشكل دوري، اختر التطبيق المناسب لنظام تشغيلك.
      </p>
    </div>

    <!-- Software Grid (Dynamic) -->
    <div id="downloadsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
      <!-- يتم التحميل ديناميكياً بواسطة JavaScript -->
    </div>

  </main>

  <footer class="bg-black/50 border-t border-white/10 py-6 text-center text-xs text-slate-500">
    &copy; 2026 <strong>منظومة سمت SAMT</strong>. جميع الحقوق محفوظة.
  </footer>

  <script src="./assets/js/courses-data.js"></script>
  <script src="./assets/js/auth.js"></script>

  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      if (theme === 'light') {
        htmlEl.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon text-samt-blue';
      } else {
        htmlEl.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun text-samt-gold';
      }
      localStorage.setItem('samt_theme', theme);
    }
    applyTheme(localStorage.getItem('samt_theme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark');
    });

    // Dynamic Downloads Engine
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('downloadsGrid');
      let releases = [];
      try {
        releases = JSON.parse(localStorage.getItem('samt_admin_releases')) || window.AgentProData?.releases || [];
      } catch(e) {
        releases = window.AgentProData?.releases || [];
      }

      if (!releases || releases.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 glass-card rounded-2xl border border-white/10">
            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 text-slate-500 text-3xl flex items-center justify-center mx-auto mb-4">
              <i class="fa-solid fa-cube"></i>
            </div>
            <h3 class="text-base font-bold font-cairo text-white">لا توجد برامج وتطبيقات مرفوعة حالياً</h3>
            <p class="text-xs text-slate-400 mt-1">سيتم إدراج روابط وتفاصيل التنزيل فور نشرها من قبل إدارة منظومة سمت.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = releases.map(app => `
        <div class="glass-card rounded-2xl p-6 flex flex-col justify-between group transition-all">
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="text-3xl">${app.icon || '📦'}</span>
              <span class="px-2.5 py-0.5 rounded-full bg-samt-cyan/10 text-samt-cyan text-[10px] font-extrabold border border-samt-cyan/30">
                ${app.version || 'إصدار رسمي'} (${app.fileSize || 'مباشر'})
              </span>
            </div>
            <h3 class="text-lg font-bold mb-2 font-cairo">${app.name}</h3>
            <p class="text-slate-400 text-xs leading-relaxed mb-6">${app.desc || ''}</p>
            ${app.platforms ? `
              <ul class="space-y-1.5 text-xs text-slate-300 mb-6">
                ${app.platforms.map(p => `<li><i class="fa-solid fa-check text-emerald-400 ml-1.5"></i>${p}</li>`).join('')}
              </ul>
            ` : ''}
          </div>
          <a href="${app.downloadUrl || '#'}" class="btn-samt-glow w-full py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i>
            <span>تحميل البرنامج</span>
          </a>
        </div>
      `).join('');
    });
  </script>

</body>
</html>
