  <style>
    body { font-family: 'Readex Pro', 'Cairo', sans-serif; overflow-x: hidden; }
    html.dark body { background-color: #070A12; color: #FFFFFF; }
    html.dark .glass-card { background: rgba(14,23,46,0.78); backdrop-filter: blur(16px); border: 1px solid rgba(0,245,212,0.16); color:#FFFFFF; }
    html:not(.dark) body { background-color:#F8FAFC; color:#0B132B; }
    html:not(.dark) .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border:1px solid rgba(0,187,249,0.18); color:#0B132B; }

  <style id="samt-responsive-fix">
    /* Android browsers (Chrome, Brave, Samsung Internet, MIUI...) each inflate
       page text by a different amount. That is why the header fitted on one
       phone and wrapped onto two lines on another. Pin it so every browser
       renders the same size. */
    html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* `clip` contains horizontal overflow WITHOUT creating a scroll container.
       Plain `hidden` here silently breaks every `position: sticky` on the page. */
    html, body { overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    /* ---- phone performance ----
       backdrop-filter is by far the most expensive effect on this page, and it
       is used ~48 times, stacked over an animated background - so the browser
       can never cache any of it. Mid-range phones respond by discarding
       painted tiles, which is what showed up as blank areas while scrolling
       fast. Below 900px (and on any touch device) the frosted glass becomes a
       plain solid panel, which looks nearly identical over a dark sky. */
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      .glass-card, header, .samt-app, .samt-auth-slot button,
      .samt-auth-slot a, #themeToggle, .btn-samt-glow {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      .glass-card { background-color: rgba(13, 21, 42, .94) !important; }
      header      { background-color: rgba(7, 10, 18, .96) !important; }
      /* a 30px blur behind every program card, on top of everything else */
      .samt-media-bg { filter: none !important; opacity: .25 !important; }
      .samt-shine { display: none !important; }
      .samt-app:hover { transform: none !important; }
    }
    .celestial-canvas { overflow: hidden !important; }

    /* the header is a single row that must never wrap or grow taller */
    header .max-w-7xl { flex-wrap: nowrap !important; }
    header a.group, header .samt-auth-slot, header #themeToggle { flex-shrink: 0; }
    .samt-auth-slot button, .samt-auth-slot a { white-space: nowrap; }
    header a.group span { white-space: nowrap; }

    @media (max-width: 640px) {
      header .max-w-7xl { padding-left:.7rem !important; padding-right:.7rem !important; }
      header a .w-10.h-10 { width:2rem !important; height:2rem !important; }
      header a span.text-2xl { font-size:1.1rem !important; }
      header a span.text-xl { font-size:.8rem !important; letter-spacing:.05em !important; }
      header a.group { gap:.45rem !important; }
      header .max-w-7xl > div.flex.items-center.gap-3 { gap:.35rem !important; }
      .samt-auth-slot button { padding:.35rem .6rem !important; font-size:.68rem !important; }
      header button.md\:hidden { padding:.25rem !important; }
    }

    /* narrow phones (most Android handsets report 360-412px) */
    @media (max-width: 420px) {
      header a .w-10.h-10 { width:1.7rem !important; height:1.7rem !important; }
      header a span.text-2xl { font-size:.95rem !important; }
      header a span.text-xl { font-size:.7rem !important; }
      header a.group { gap:.35rem !important; }
      header .max-w-7xl > div.flex.items-center.gap-3 { gap:.25rem !important; }
      .samt-auth-slot button { padding:.3rem .55rem !important; font-size:.62rem !important; }
      header #themeToggle { width:2rem !important; height:2rem !important; }
    }

    /* very small screens: the latin wordmark is the first thing to go */
    @media (max-width: 340px) {
      header a span.text-xl { display:none !important; }
    }
  </style>

  <script>
    (function () {
      var MAX_SHOTS = 4;
      var state = { id: '', type: 'play', icon: '', shots: [] };
      var editId = new URLSearchParams(location.search).get('edit') || '';

      var $ = function (id) { return document.getElementById(id); };

      /* ---------- image helpers ---------- */
      // Downscale + re-encode in the browser so a screenshot costs tens of KB
      // instead of megabytes. WebP when the browser supports it, else JPEG.
      function compress(file, maxW, quality) {
        return new Promise(function (resolve, reject) {
          if (!file || !/^image\//.test(file.type)) return reject(new Error('not-image'));
          var fr = new FileReader();
          fr.onerror = function () { reject(new Error('read-failed')); };
          fr.onload = function () {
            var img = new Image();
            img.onerror = function () { reject(new Error('decode-failed')); };
            img.onload = function () {
              var scale = Math.min(1, maxW / (img.width || maxW));
              var w = Math.max(1, Math.round(img.width * scale));
              var h = Math.max(1, Math.round(img.height * scale));
              var c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              var out = '';
              try { out = c.toDataURL('image/webp', quality); } catch (e) {}
              if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', quality);
              resolve(out);
            };
            img.src = fr.result;
          };
          fr.readAsDataURL(file);
        });
      }

      function bytesOf(dataUrl) {
        if (!dataUrl || dataUrl.indexOf('data:') !== 0) return 0;
        return Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75);
      }
      function human(b) {
        return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
      }

      /* ---------- google play ---------- */
      function playPackage(url) {
        var m = String(url || '').match(/[?&]id=([A-Za-z0-9._]+)/);
        return m ? m[1] : '';
      }

      /* ---------- type switching ---------- */
      function setType(t) {
        state.type = t;
        [].forEach.call($('typeSeg').children, function (b) {
          b.classList.toggle('on', b.getAttribute('data-type') === t);
        });
        $('urlLabel').textContent = t === 'play' ? 'رابط البرنامج على جوجل بلاي'
                                  : t === 'web' ? 'رابط التطبيق' : 'رابط التحميل المباشر';
        $('fUrl').placeholder = t === 'play' ? 'https://play.google.com/store/apps/details?id=com.example.app'
                              : t === 'web' ? 'https://app.example.com'
                              : 'https://example.com/setup.exe';
        $('sizeWrap').style.display = t === 'direct' ? '' : 'none';
        checkUrl();
        render();
      }

      function checkUrl() {
        var v = $('fUrl').value.trim();
        var hint = $('urlHint');
        hint.className = 'text-[11px] mt-1.5';
        if (!v) { hint.textContent = ''; return; }
        if (state.type === 'play') {
          var pkg = playPackage(v);
          if (pkg) {
            hint.textContent = 'تم التعرّف على التطبيق: ' + pkg;
            hint.classList.add('text-emerald-400');
          } else {
            hint.textContent = 'الرابط مش شكل رابط جوجل بلاي — لازم يحتوي على ‎?id=‎';
            hint.classList.add('text-amber-400');
          }
        } else if (!/^https?:\/\//i.test(v)) {
          hint.textContent = 'الرابط لازم يبدأ بـ http:// أو https://';
          hint.classList.add('text-amber-400');
        } else {
          hint.textContent = '';
        }
      }

      /* ---------- preview ---------- */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function fallbackTile(name) {
        var ch = (String(name || '؟').trim()[0] || '؟');
        return '<div class="w-full h-full flex items-center justify-center text-3xl font-black text-samt-space"'
             + ' style="background:linear-gradient(135deg,#00F5D4,#00BBF9)">' + esc(ch) + '</div>';
      }

      function render() {
        var name = $('fName').value.trim() || 'اسم البرنامج';
        var desc = $('fDesc').value.trim();
        var ver = $('fVersion').value.trim();
        var size = $('fSize').value.trim();
        var icon = state.icon || $('fIconUrl').value.trim();
        var shots = state.shots;
        var btn = state.type === 'play'
          ? '<i class="fa-brands fa-google-play"></i><span>تثبيت من جوجل بلاي</span>'
          : state.type === 'web'
          ? '<i class="fa-solid fa-arrow-up-right-from-square"></i><span>فتح التطبيق</span>'
          : '<i class="fa-solid fa-download"></i><span>تحميل البرنامج</span>';

        $('preview').innerHTML =
          (shots.length
            ? '<div class="relative aspect-video bg-black/40 overflow-hidden">'
              + '<img src="' + esc(shots[0]) + '" class="w-full h-full object-cover" alt="">'
              + (shots.length > 1 ? '<span class="absolute bottom-2 inset-inline-start-2 text-[10px] px-2 py-0.5 rounded-full bg-black/70 text-samt-cyan">'
                  + shots.length + ' لقطات تتبدّل</span>' : '')
              + '</div>'
            : '')
          + '<div class="p-5">'
          +   '<div class="flex items-start gap-3 mb-3">'
          +     '<div class="w-12 h-12 rounded-xl overflow-hidden flex-shrink-0 border border-white/15">'
          +       (icon ? '<img src="' + esc(icon) + '" class="w-full h-full object-cover" alt="">' : fallbackTile(name))
          +     '</div>'
          +     '<div class="min-w-0">'
          +       '<h3 class="text-sm font-bold font-cairo truncate">' + esc(name) + '</h3>'
          +       (ver || size
                    ? '<div class="text-[10px] text-samt-cyan font-mono mt-0.5">' + esc([ver, size].filter(Boolean).join(' • ')) + '</div>'
                    : '')
          +     '</div>'
          +   '</div>'
          +   (desc ? '<p class="text-[11px] text-slate-400 leading-relaxed mb-4">' + esc(desc) + '</p>' : '')
          +   '<div class="btn-samt-glow w-full py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">' + btn + '</div>'
          + '</div>';

        var shotBytes = state.shots.reduce(function (a, s) { return a + bytesOf(s); }, 0);
        var iconBytes = bytesOf(state.icon);
        $('sizeNote').textContent = (shotBytes || iconBytes)
          ? ('اللقطات: ' + human(shotBytes) + ' من 900 KB  •  الأيقونة: ' + human(iconBytes) + ' من 250 KB')
          : '';
        $('sizeNote').className = 'text-[11px] mt-2 '
          + ((shotBytes > 780000 || iconBytes > 200000) ? 'text-amber-400' : 'text-slate-500');
      }

      /* ---------- shots list ---------- */
      function renderShots() {
        $('shotList').innerHTML = state.shots.map(function (s, i) {
          return '<div class="shot aspect-video"><img src="' + esc(s) + '" alt="">'
               + '<button type="button" data-i="' + i + '"><i class="fa-solid fa-xmark"></i></button></div>';
        }).join('');
        [].forEach.call($('shotList').querySelectorAll('button'), function (b) {
          b.addEventListener('click', function () {
            state.shots.splice(parseInt(b.getAttribute('data-i'), 10), 1);
            renderShots(); render();
          });
        });
        render();
      }

      function addShot(dataUrl) {
        if (state.shots.length >= MAX_SHOTS) { msg('الحد الأقصى ' + MAX_SHOTS + ' لقطات', 'amber'); return; }
        state.shots.push(dataUrl);
        renderShots();
      }

      function msg(t, tone) {
        $('saveMsg').textContent = t || '';
        $('saveMsg').className = 'text-xs ' + (tone === 'ok' ? 'text-emerald-400' : tone === 'bad' ? 'text-rose-400' : tone === 'amber' ? 'text-amber-400' : 'text-slate-400');
      }

      /* ---------- wiring ---------- */
      [].forEach.call($('typeSeg').children, function (b) {
        b.addEventListener('click', function () { setType(b.getAttribute('data-type')); });
      });
      ['fName', 'fDesc', 'fVersion', 'fSize', 'fPlat'].forEach(function (id) {
        $(id).addEventListener('input', render);
      });
      $('fUrl').addEventListener('input', function () { checkUrl(); render(); });
      $('fIconUrl').addEventListener('input', function () { state.icon = ''; render(); });

      function hookDrop(dropEl, inputEl, handler) {
        dropEl.addEventListener('click', function () { inputEl.click(); });
        ['dragenter', 'dragover'].forEach(function (ev) {
          dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.add('hot'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
          dropEl.addEventListener(ev, function (e) { e.preventDefault(); dropEl.classList.remove('hot'); });
        });
        dropEl.addEventListener('drop', function (e) {
          handler([].slice.call((e.dataTransfer && e.dataTransfer.files) || []));
        });
        inputEl.addEventListener('change', function () {
          handler([].slice.call(inputEl.files || []));
          inputEl.value = '';
        });
      }

      function takeIcon(files) {
        if (!files.length) return;
        compress(files[0], 256, 0.92).then(function (d) {
          state.icon = d; $('fIconUrl').value = '';
          $('iconPrev').innerHTML = '<img src="' + esc(d) + '" class="w-full h-full object-cover" alt="">';
          render();
        }).catch(function () { msg('تعذّر قراءة الصورة', 'bad'); });
      }
      function takeShots(files) {
        files.slice(0, MAX_SHOTS).forEach(function (f) {
          compress(f, 1000, 0.86).then(addShot).catch(function () { msg('تعذّر قراءة إحدى الصور', 'bad'); });
        });
      }

      hookDrop($('iconDrop'), $('iconFile'), takeIcon);
      hookDrop($('shotDrop'), $('shotFile'), takeShots);

      $('fShotUrl').addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var v = $('fShotUrl').value.trim();
        if (v) { addShot(v); $('fShotUrl').value = ''; }
      });

      // paste an image straight from the clipboard
      document.addEventListener('paste', function (e) {
        var items = (e.clipboardData && e.clipboardData.items) || [];
        var imgs = [].slice.call(items).filter(function (it) { return it.type && it.type.indexOf('image/') === 0; });
        if (!imgs.length) return;
        var f = imgs[0].getAsFile();
        if (!f) return;
        e.preventDefault();
        if (document.activeElement === $('fShotUrl') || state.icon) takeShots([f]);
        else takeIcon([f]);
      });

      /* ---------- load / save ---------- */
      function readPrograms() {
        try { return JSON.parse(localStorage.getItem('samt_admin_releases')) || []; } catch (e) { return []; }
      }

      function fill(pr, assets) {
        state.id = pr.id || '';
        state.icon = (pr.icon && pr.icon.indexOf('data:') === 0) ? pr.icon : '';
        state.shots = (assets && assets.shots) || [];
        $('fName').value = pr.name || '';
        $('fDesc').value = pr.desc || '';
        $('fUrl').value = pr.url || pr.downloadUrl || '';
        $('fVersion').value = pr.version || '';
        $('fSize').value = pr.fileSize || '';
        $('fPlat').value = (pr.platforms || pr.requirements || []).join('\n');
        if (!state.icon && pr.icon) $('fIconUrl').value = pr.icon;
        if (state.icon) $('iconPrev').innerHTML = '<img src="' + esc(state.icon) + '" class="w-full h-full object-cover" alt="">';
        setType(pr.type || 'play');
        renderShots();
        $('pageTitle').innerHTML = 'تعديل <span class="text-gradient">البرنامج</span>';
        $('deleteBtn').classList.remove('hidden');
      }

      $('saveBtn').addEventListener('click', function () {
        var name = $('fName').value.trim();
        var url = $('fUrl').value.trim();
        if (!name) { msg('لازم تكتب اسم البرنامج', 'bad'); return; }
        if (!url) { msg('لازم تحط رابط البرنامج', 'bad'); return; }
        if (state.type === 'play' && !playPackage(url)) { msg('رابط جوجل بلاي غير صحيح', 'bad'); return; }

        var shotBytes = state.shots.reduce(function (a, s) { return a + bytesOf(s); }, 0);
        var iconBytes = bytesOf(state.icon);
        if (shotBytes > 900000) { msg('حجم اللقطات كبير — امسح لقطة أو اتنين', 'bad'); return; }
        if (iconBytes > 250000) { msg('حجم الأيقونة كبير — جرّب صورة أصغر', 'bad'); return; }

        var programs = readPrograms();
        var id = state.id || ('app-' + Date.now());
        var rec = {
          id: id,
          name: name,
          desc: $('fDesc').value.trim(),
          type: state.type,
          url: url,
          downloadUrl: url, // kept so older markup keeps working
          pkg: state.type === 'play' ? playPackage(url) : '',
          version: $('fVersion').value.trim(),
          fileSize: state.type === 'direct' ? $('fSize').value.trim() : '',
          platforms: $('fPlat').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean),
          icon: state.icon || $('fIconUrl').value.trim(),
          shotCount: state.shots.length
        };

        var idx = programs.findIndex(function (p) { return p.id === id; });
        if (idx >= 0) { rec.createdAt = programs[idx].createdAt; programs[idx] = rec; }
        else programs.unshift(rec);

        try { localStorage.setItem('samt_admin_releases', JSON.stringify(programs)); } catch (e) {}
        msg('جارٍ الحفظ على السحابة...');

        if (!(window.SamtFB && window.SamtFB.available)) {
          msg('اتحفظ محلياً — فايربيز مش متاح', 'amber');
          return;
        }
        window.SamtFB.syncProgramsToCloud(programs)
          .then(function () { return window.SamtFB.saveProgramAssets(id, { shots: state.shots }); })
          .then(function () {
            msg('تم النشر بنجاح', 'ok');
            setTimeout(function () { location.href = './downloads.html'; }, 700);
          })
          .catch(function (e) {
            msg('فشل النشر: ' + (e && e.message ? e.message : 'خطأ غير معروف'), 'bad');
          });
      });

      $('deleteBtn').addEventListener('click', function () {
        if (!state.id) return;
        if (!confirm('تأكيد حذف البرنامج؟')) return;
        var programs = readPrograms().filter(function (p) { return p.id !== state.id; });
        try { localStorage.setItem('samt_admin_releases', JSON.stringify(programs)); } catch (e) {}
        if (window.SamtFB && window.SamtFB.available) {
          window.SamtFB.syncProgramsToCloud(programs)
            .then(function () { location.href = './downloads.html'; })
            .catch(function (e) { msg('فشل الحذف: ' + (e && e.message), 'bad'); });
        } else {
          location.href = './downloads.html';
        }
      });

      /* ---------- admin gate ---------- */
      function unlock() {
        $('guardScreen').classList.add('hidden');
        $('builderMain').classList.remove('hidden');
        setType('play');
        if (editId) {
          var pr = readPrograms().filter(function (p) { return p.id === editId; })[0];
          if (pr) {
            if (window.SamtFB && window.SamtFB.loadProgramAssets) {
              window.SamtFB.loadProgramAssets(editId).then(function (a) { fill(pr, a); });
            } else { fill(pr, null); }
          }
        }
        render();
      }

      function deny() {
        $('guardMsg').innerHTML = 'الصفحة دي للمشرف فقط. <a href="./downloads.html" class="text-samt-cyan font-bold">رجوع</a>';
        $('guardScreen').querySelector('i').className = 'fa-solid fa-lock';
      }

      if (window.SamtFB && window.SamtFB.available) {
        window.SamtFB.onAuthChange(function () {
          if (window.SamtFB.isAdmin()) unlock(); else deny();
        });
      } else {
        setTimeout(function () {
          var s = null;
          try { s = JSON.parse(localStorage.getItem('samt_user_session') || 'null'); } catch (e) {}
          if (s && s.role === 'admin') unlock(); else deny();
        }, 400);
      }
    })();
  </script>
</body>
</html>
