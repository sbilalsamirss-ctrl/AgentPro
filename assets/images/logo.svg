<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0077FE" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0077FE" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Hexagonal Background / Shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoGrad)" />
    
    <!-- Headset & Audio Wave Graphic -->
    <!-- Headset Band -->
    <path d="M 17 31 A 13 13 0 0 1 43 31" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="14" y="29" width="6" height="11" rx="3" fill="#FFFFFF" />
    <!-- Right Ear Cup -->
    <rect x="40" y="29" width="6" height="11" rx="3" fill="#FFFFFF" />
    <!-- Mic Boom -->
    <path d="M 43 37 Q 44 45 34 45 L 30 45" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="45" r="2.5" fill="#00D2FF"/>
    
    <!-- Center Live Pulse Waves -->
    <path d="M 23 27 L 23 35 M 27 24 L 27 38 M 31 22 L 31 40 M 35 25 L 35 37 M 39 28 L 39 34" 
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Agent<tspan fill="#0077FE">Pro</tspan>
  </text>
  <text x="84" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">
    CALL CENTER SUITE
  </text>
</svg>
