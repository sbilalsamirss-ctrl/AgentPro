<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغل الكورس والدروس | أكاديمية سمت SAMT</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%2300F5D4' stroke-width='4'/><circle cx='50' cy='50' r='6' fill='%2300BBF9'/><line x1='50' y1='6' x2='50' y2='94' stroke='%2300F5D4' stroke-width='3'/><line x1='6' y1='50' x2='94' y2='50' stroke='%2300F5D4' stroke-width='3'/></svg>" type="image/svg+xml">

  <!-- Open Graph / Social -->
  <meta property="og:title" content="مشغل الكورس والدروس | أكاديمية سمت SAMT" />
  <meta property="og:description" content="واجهة الدراسة التفاعلية لأكاديمية سمت." />
  <meta property="og:url" content="https://sbilalsamirss-ctrl.github.io/AgentPro/course-view.html" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            samt: {
              space: '#070A12', navy: '#0B132B', card: '#0E172E',
              cyan: '#00F5D4', blue: '#00BBF9', purple: '#7928CA', gold: '#FFB703',
              border: 'rgba(0, 245, 212, 0.18)'
            }
          },
          fontFamily: {
            readex: ['"Readex Pro"', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', '"Readex Pro"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after {
      transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Readex Pro', 'Cairo', sans-serif; overflow-x: hidden; }

    html.dark body { background-color: #070A12; color: #FFFFFF; }
    html.dark .glass-card {
      background: rgba(14, 23, 46, 0.78); backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.16); color: #FFFFFF;
    }
    html.dark .glass-card:hover {
      border-color: rgba(0, 245, 212, 0.45);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 245, 212, 0.2);
    }
    html.dark .celestial-canvas { opacity: 1; }

    html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
    html:not(.dark) .glass-card { background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #0F172A; }
    html:not(.dark) .text-slate-300, html:not(.dark) .text-slate-400 { color: #475569 !important; }
    html:not(.dark) .text-white { color: #0F172A !important; }
    html:not(.dark) .celestial-canvas { opacity: 0; }

    .lesson-item.active {
      background: rgba(0, 245, 212, 0.12) !important;
      border-color: rgba(0, 245, 212, 0.4) !important;
    }

    /* ==========================================================================
       ✨ Celestial Animated Background Layers
       ========================================================================== */
    .celestial-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    /* ⭐ Twinkling Stars Layer */
    .stars-layer {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1.5px 1.5px at 25% 42%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 47% 8%, rgba(0,245,212,0.8), transparent),
        radial-gradient(2px 2px at 62% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 78% 22%, rgba(0,187,249,0.7), transparent),
        radial-gradient(1.5px 1.5px at 88% 70%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 35% 78%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 55% 88%, rgba(0,245,212,0.6), transparent);
      animation: twinkleStars 4s ease-in-out infinite alternate;
    }
    .stars-layer-2 {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 30%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 40% 18%, rgba(0,245,212,0.6), transparent),
        radial-gradient(1px 1px at 58% 72%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 80% 45%, rgba(0,187,249,0.5), transparent),
        radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 68% 12%, rgba(255,255,255,0.6), transparent);
      animation: twinkleStars2 5.5s ease-in-out infinite alternate;
    }

    @keyframes twinkleStars {
      0%   { opacity: 0.5; }
      30%  { opacity: 0.8; }
      60%  { opacity: 0.45; }
      100% { opacity: 0.75; }
    }
    @keyframes twinkleStars2 {
      0%   { opacity: 0.7; }
      40%  { opacity: 0.35; }
      70%  { opacity: 0.65; }
      100% { opacity: 0.4; }
    }

    /* 🌫️ Drifting Nebulae Layer */
    .nebula-layer {
      position: absolute; inset: -20%; width: 140%; height: 140%;
    }
    .nebula-1 {
      position: absolute;
      width: 600px; height: 600px;
      top: -5%; right: -8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 187, 249, 0.14) 0%, transparent 70%);
      filter: blur(80px);
      animation: driftNebula1 35s ease-in-out infinite alternate;
    }
    .nebula-2 {
      position: absolute;
      width: 500px; height: 500px;
      bottom: 5%; left: -5%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(121, 40, 202, 0.12) 0%, transparent 70%);
      filter: blur(70px);
      animation: driftNebula2 42s ease-in-out infinite alternate;
    }
    .nebula-3 {
      position: absolute;
      width: 450px; height: 450px;
      top: 40%; left: 30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.1) 0%, transparent 70%);
      filter: blur(90px);
      animation: driftNebula3 50s ease-in-out infinite alternate;
    }

    @keyframes driftNebula1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-40px, 30px) scale(1.08); }
      100% { transform: translate(20px, -20px) scale(0.95); }
    }
    @keyframes driftNebula2 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(35px, -25px) scale(1.05); }
      100% { transform: translate(-15px, 15px) scale(0.97); }
    }
    @keyframes driftNebula3 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.8; }
      50%  { transform: translate(-30px, -20px) scale(1.1); opacity: 1; }
      100% { transform: translate(25px, 30px) scale(0.9); opacity: 0.7; }
    }

    .theme-icon-rotate {
      transform: rotate(360deg) scale(1.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 🌌 Celestial Animated Background (Stars + Nebulae) -->
  <div class="celestial-canvas" aria-hidden="true">
    <div class="stars-layer"></div>
    <div class="stars-layer-2"></div>
    <div class="nebula-layer">
      <div class="nebula-1"></div>
      <div class="nebula-2"></div>
      <div class="nebula-3"></div>
    </div>
  </div>

  <!-- Top Classroom Bar -->
  <header class="h-16 glass-card px-4 sm:px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-4">
      <a href="./courses.html" class="text-xs font-bold hover:text-samt-cyan flex items-center gap-2">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة لقائمة الكورسات</span>
      </a>
      <span class="text-slate-500">|</span>
      <h1 id="topCourseTitle" class="text-xs sm:text-sm font-bold truncate max-w-xs sm:max-w-md font-cairo">جاري تحميل الكورس...</h1>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <div class="text-[10px] text-slate-400 font-bold">نسبة إنجازك</div>
          <div id="progressPercent" class="text-xs font-black text-samt-cyan font-mono">0%</div>
        </div>
        <div class="w-24 sm:w-32 h-2 bg-black/40 rounded-full overflow-hidden border border-white/10">
          <div id="progressBar" class="h-full bg-gradient-to-r from-samt-cyan to-samt-blue rounded-full transition-all" style="width: 0%"></div>
        </div>
      </div>
      <button id="themeToggle" class="w-8 h-8 rounded-full glass-card flex items-center justify-center text-xs">
        <i id="themeIcon" class="fa-solid fa-sun text-samt-gold"></i>
      </button>
      <div class="samt-auth-slot"></div>
    </div>
  </header>

  <!-- Classroom Workspace -->
  <div class="flex-grow flex flex-col lg:flex-row max-w-7xl mx-auto w-full p-4 sm:p-6 gap-6 relative z-10">
    
    <!-- Video Player & Details -->
    <div class="flex-grow flex flex-col space-y-4">
      <div class="relative aspect-video rounded-2xl overflow-hidden glass-card shadow-2xl bg-black border border-white/15">
        <iframe id="mainPlayer" class="w-full h-full border-none" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="glass-card rounded-2xl p-6 text-right space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
          <div>
            <span id="lessonCategory" class="text-xs font-extrabold text-samt-cyan uppercase">الدرس 1</span>
            <h2 id="lessonTitle" class="text-xl font-bold mt-1 font-cairo">عنوان الدرس</h2>
          </div>
          <button id="toggleCompleteBtn" class="px-4 py-2 rounded-xl glass-card border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 text-xs font-bold flex items-center gap-2 transition-all">
            <i class="fa-regular fa-circle-check"></i>
            <span>تحديد الدرس كمكتمل</span>
          </button>
        </div>
        <p id="lessonDesc" class="text-xs sm:text-sm text-slate-300 leading-relaxed"></p>
        <!-- Attachments & Files -->
        <div id="attachmentsBox" class="pt-4 border-t border-white/10 hidden">
          <div class="text-xs font-bold text-samt-gold mb-2.5 flex items-center gap-2"><i class="fa-solid fa-paperclip"></i><span>المرفقات:</span></div>
          <div id="attachmentsList" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>

    <!-- Sidebar: Lessons List -->
    <div class="w-full lg:w-96 flex-shrink-0">
      <div class="glass-card rounded-2xl p-5 sticky top-24 space-y-4 text-right">
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h3 class="text-sm font-bold font-cairo">محتوى الدورة والدروس</h3>
          <span id="lessonsCount" class="text-xs text-slate-400 font-mono font-bold">3 دروس</span>
        </div>
        <div id="lessonsList" class="space-y-2.5 max-h-[600px] overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <script src="./assets/js/courses-data.js"></script>
  <script src="./assets/js/auth.js"></script>

  <script>
    // Theme
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      themeIcon.classList.add('theme-icon-rotate');
      setTimeout(() => themeIcon.classList.remove('theme-icon-rotate'), 500);

      if (theme === 'light') { htmlEl.classList.remove('dark'); themeIcon.className = 'fa-solid fa-moon text-samt-blue text-base'; }
      else { htmlEl.classList.add('dark'); themeIcon.className = 'fa-solid fa-sun text-samt-gold text-base'; }
      localStorage.setItem('samt_theme', theme);
    }
    applyTheme(localStorage.getItem('samt_theme') || 'dark');
    themeToggle.addEventListener('click', () => { applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark'); });

    // Classroom Engine
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('id') || 'course-01';
      const courses = JSON.parse(localStorage.getItem('samt_admin_courses')) || window.AgentProData?.courses || [];
      const course = courses.find(c => c.id === courseId) || courses[0];
      if (!course) { window.location.href = './courses.html'; return; }

      const lessons = course.lessons || [
        { id: 'l1', title: course.title + ' (الجزء الأول)', duration: '04:15', videoUrl: course.videoUrl, desc: course.description },
        { id: 'l2', title: 'التطبيق العملي والإعدادات المتقدمة', duration: '05:30', videoUrl: course.videoUrl, desc: 'تطبيق عملي خطوة بخطوة.' },
        { id: 'l3', title: 'حل المشكلات وأفضل الممارسات', duration: '03:45', videoUrl: course.videoUrl, desc: 'نصائح لزيادة الكفاءة والإنتاجية.' }
      ];

      let currentLessonIndex = 0;
      let completedLessons = JSON.parse(localStorage.getItem('samt_completed_' + course.id) || '[]');

      const topTitle = document.getElementById('topCourseTitle');
      const player = document.getElementById('mainPlayer');
      const lessonTitle = document.getElementById('lessonTitle');
      const lessonDesc = document.getElementById('lessonDesc');
      const lessonCategory = document.getElementById('lessonCategory');
      const lessonsList = document.getElementById('lessonsList');
      const lessonsCount = document.getElementById('lessonsCount');
      const progressPercent = document.getElementById('progressPercent');
      const progressBar = document.getElementById('progressBar');
      const toggleCompleteBtn = document.getElementById('toggleCompleteBtn');
      const attachmentsBox = document.getElementById('attachmentsBox');
      const attachmentsList = document.getElementById('attachmentsList');

      topTitle.textContent = course.title;
      lessonsCount.textContent = lessons.length + ' دروس';

      function updateProgress() {
        const percent = Math.round((completedLessons.length / lessons.length) * 100);
        progressPercent.textContent = percent + '%';
        progressBar.style.width = percent + '%';
        localStorage.setItem('samt_completed_' + course.id, JSON.stringify(completedLessons));
      }

      function renderLessons() {
        lessonsList.innerHTML = lessons.map((l, idx) => {
          const isDone = completedLessons.includes(l.id);
          const isActive = idx === currentLessonIndex;
          return '<div class="lesson-item p-3.5 rounded-xl border border-white/10 glass-card cursor-pointer flex items-center justify-between gap-3 ' + (isActive ? 'active' : '') + '" onclick="selectLesson(' + idx + ')">' +
            '<div class="flex items-center gap-3"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ' + (isDone ? 'bg-emerald-500 text-black' : 'bg-white/10 text-slate-400') + '">' + (isDone ? '<i class="fa-solid fa-check"></i>' : (idx + 1)) + '</span><div><h4 class="text-xs sm:text-sm font-bold font-cairo">' + l.title + '</h4><span class="text-[10px] text-slate-400 font-mono">' + l.duration + '</span></div></div>' +
            '<i class="fa-solid ' + (isActive ? 'fa-circle-play text-samt-cyan' : 'fa-play text-slate-400 text-xs') + '"></i></div>';
        }).join('');
      }

      window.selectLesson = function(index) {
        currentLessonIndex = index;
        const cl = lessons[index];
        player.src = cl.videoUrl;
        lessonTitle.textContent = cl.title;
        lessonDesc.textContent = cl.desc || course.description;
        lessonCategory.textContent = 'الدرس ' + (index + 1) + ' من ' + lessons.length;

        const isDone = completedLessons.includes(cl.id);
        toggleCompleteBtn.innerHTML = isDone
          ? '<i class="fa-solid fa-circle-check text-emerald-400"></i><span>تم الإكمال (اضغط للإلغاء)</span>'
          : '<i class="fa-regular fa-circle-check"></i><span>تحديد الدرس كمكتمل</span>';
        toggleCompleteBtn.classList.toggle('bg-emerald-500/20', isDone);

        if (course.attachments && course.attachments.length > 0) {
          attachmentsBox.classList.remove('hidden');
          attachmentsList.innerHTML = course.attachments.map(a => '<a href="' + a.url + '" class="px-3 py-1.5 rounded-lg glass-card text-xs font-bold hover:text-samt-cyan flex items-center gap-2"><i class="fa-solid fa-download text-samt-cyan text-xs"></i><span>' + a.name + '</span></a>').join('');
        } else { attachmentsBox.classList.add('hidden'); }

        renderLessons();
        updateProgress();
      };

      toggleCompleteBtn.addEventListener('click', () => {
        const cl = lessons[currentLessonIndex];
        if (completedLessons.includes(cl.id)) completedLessons = completedLessons.filter(id => id !== cl.id);
        else completedLessons.push(cl.id);
        selectLesson(currentLessonIndex);
      });

      selectLesson(0);
    });
  </script>
</body>
</html>
