  <style id="samt-responsive-fix">
    /* Android browsers (Chrome, Brave, Samsung Internet, MIUI...) each inflate
       page text by a different amount. That is why the header fitted on one
       phone and wrapped onto two lines on another. Pin it so every browser
       renders the same size. */
    html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* `clip` contains horizontal overflow WITHOUT creating a scroll container.
       Plain `hidden` here silently breaks every `position: sticky` on the page. */
    html, body { overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    /* ---- phone performance ----
       backdrop-filter is by far the most expensive effect on this page, and it
       is used ~48 times, stacked over an animated background - so the browser
       can never cache any of it. Mid-range phones respond by discarding
       painted tiles, which is what showed up as blank areas while scrolling
       fast. Below 900px (and on any touch device) the frosted glass becomes a
       plain solid panel, which looks nearly identical over a dark sky. */
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      .glass-card, header, .samt-app, .samt-auth-slot button,
      .samt-auth-slot a, #themeToggle, .btn-samt-glow {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      .glass-card { background-color: rgba(13, 21, 42, .94) !important; }
      header      { background-color: rgba(7, 10, 18, .96) !important; }
      /* a 30px blur behind every program card, on top of everything else */
      .samt-media-bg { filter: none !important; opacity: .25 !important; }
      .samt-shine { display: none !important; }
      .samt-app:hover { transform: none !important; }
    }

    /* the header is a single row that must never wrap or grow taller */
    header .max-w-7xl { flex-wrap: nowrap !important; }
    header a.group, header .samt-auth-slot, header #themeToggle { flex-shrink: 0; }
    .samt-auth-slot button, .samt-auth-slot a { white-space: nowrap; }
    header a.group span { white-space: nowrap; }

    @media (max-width: 640px) {
      header .max-w-7xl { padding-left:.7rem !important; padding-right:.7rem !important; }
      header a .w-10.h-10 { width:2rem !important; height:2rem !important; }
      header a span.text-2xl { font-size:1.1rem !important; }
      header a span.text-xl { font-size:.8rem !important; letter-spacing:.05em !important; }
      header a.group { gap:.45rem !important; }
      header .max-w-7xl > div.flex.items-center.gap-3 { gap:.35rem !important; }
      .samt-auth-slot button { padding:.35rem .6rem !important; font-size:.68rem !important; }
      header button.md\:hidden { padding:.25rem !important; }
    }

    /* narrow phones (most Android handsets report 360-412px) */
    @media (max-width: 420px) {
      header a .w-10.h-10 { width:1.7rem !important; height:1.7rem !important; }
      header a span.text-2xl { font-size:.95rem !important; }
      header a span.text-xl { font-size:.7rem !important; }

      header .max-w-7xl > div.flex.items-center.gap-3 { gap:.25rem !important; }
      .samt-auth-slot button { padding:.3rem .55rem !important; font-size:.62rem !important; }
      header #themeToggle { width:2rem !important; height:2rem !important; }
    }

    /* very small screens: the latin wordmark is the first thing to go */
    @media (max-width: 340px) {
      header a span.text-xl { display:none !important; }
    }

  <script>
    // Theme
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      if (theme === 'light') htmlEl.classList.remove('dark');
      else htmlEl.classList.add('dark');
      localStorage.setItem('samt_theme', theme);
    }
    applyTheme(localStorage.getItem('samt_theme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(htmlEl.classList.contains('dark') ? 'light' : 'dark');
    });

    // Info Tabs
    function switchInfoTab(tab) {
      document.querySelectorAll('.info-tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.info-tab').forEach(el => {
        el.classList.remove('active-tab');
        el.classList.add('text-slate-400');
      });
      const pane = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (pane) pane.classList.remove('hidden');
      const ev = window.event;
      const btn = (ev && ev.target && ev.target.closest) ? ev.target.closest('.info-tab') : null;
      if (btn) {
        btn.classList.add('active-tab');
        btn.classList.remove('text-slate-400');
      } else {
        const map = { lesson: 0, overview: 1, resources: 2 };
        const t = document.querySelectorAll('.info-tab')[map[tab]];
        if (t) { t.classList.add('active-tab'); t.classList.remove('text-slate-400'); }
      }
    }

    // Classroom Engine
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('id') || 'course-01';
      // ---- تأمين ضد حقن HTML/سكربتات (XSS) ----
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
      const safeUrl = (u) => {
        u = String(u == null ? '' : u).trim();
        return /^(?:javascript|data|vbscript|file):/i.test(u) ? '#' : esc(u);
      };
      const courses = JSON.parse(localStorage.getItem('samt_admin_courses')) || [];
      const course = courses.find(c => c.id === courseId) || courses[0];
      if (!course) {
        var hasCourses = (localStorage.getItem('samt_admin_courses') || '[]') !== '[]';
        if (window.SamtFB && window.SamtFB.available && !hasCourses) {
          window.addEventListener('samt-courses-updated', function () { location.reload(); }, { once: true });
          setTimeout(function () { window.location.href = './courses.html'; }, 5000);
          return;
        }
        window.location.href = './courses.html'; return;
      }

      // Build sections/lessons from course data
      let sections = [];
      let allLessons = [];

      if (course.sections && course.sections.length > 0) {
        // New format: sections with lectures
        sections = course.sections;
        sections.forEach(sec => {
          (sec.lectures || []).forEach(lec => {
            allLessons.push({
              ...lec,
              sectionTitle: sec.title,
              sectionId: sec.id
            });
          });
        });
      } else if (course.lessons && course.lessons.length > 0) {
        // Flat lessons (backward compat)
        allLessons = course.lessons;
        sections = [{ id: 'sec-default', title: course.title, lectures: course.lessons }];
      } else {
        // Fallback: single video
        allLessons = [{
          id: 'l1', title: course.title, duration: course.duration || '00:00',
          durationSeconds: course.durationSeconds || 0,
          videoUrl: course.videoUrl, desc: course.description, freePreview: true
        }];
        sections = [{ id: 'sec-default', title: course.title, lectures: allLessons }];
      }

      let currentLessonIndex = 0;
      let completedLessons = JSON.parse(localStorage.getItem('samt_completed_' + course.id) || '[]');

      const topTitle = document.getElementById('topCourseTitle');
      const player = document.getElementById('mainPlayer');
      const lessonTitle = document.getElementById('lessonTitle');
      const lessonDesc = document.getElementById('lessonDesc');
      const lessonCategory = document.getElementById('lessonCategory');
      const lessonsCount = document.getElementById('lessonsCount');
      const progressPercent = document.getElementById('progressPercent');
      const progressBar = document.getElementById('progressBar');
      const toggleCompleteBtn = document.getElementById('toggleCompleteBtn');
      const sidebarContent = document.getElementById('sidebarContent');

      topTitle.textContent = course.title;
      lessonsCount.textContent = allLessons.length + ' درس';

      // Populate Overview tab
      const objList = document.getElementById('overviewObjectives');
      const reqList = document.getElementById('overviewRequirements');
      const audList = document.getElementById('overviewAudience');

      if (course.objectives && course.objectives.length > 0) {
        objList.innerHTML = course.objectives.map(o => `<li class="flex items-start gap-2"><i class="fa-solid fa-check text-emerald-400 mt-0.5 text-[10px]"></i><span>${esc(o)}</span></li>`).join('');
      } else {
        objList.innerHTML = '<li class="text-slate-500">لم يتم تحديد أهداف بعد.</li>';
      }
      if (course.requirements && course.requirements.length > 0) {
        reqList.innerHTML = course.requirements.map(r => `<li class="flex items-start gap-2"><i class="fa-solid fa-circle text-samt-blue mt-1.5 text-[5px]"></i><span>${esc(r)}</span></li>`).join('');
      } else {
        reqList.innerHTML = '<li class="text-slate-500">لا توجد متطلبات محددة.</li>';
      }
      if (course.targetAudience && course.targetAudience.length > 0) {
        audList.innerHTML = course.targetAudience.map(a => `<li class="flex items-start gap-2"><i class="fa-solid fa-circle text-samt-purple mt-1.5 text-[5px]"></i><span>${esc(a)}</span></li>`).join('');
      } else {
        audList.innerHTML = '<li class="text-slate-500">لم يتم تحديد الفئة المستهدفة.</li>';
      }

      // Instructor
      if (course.instructorName) {
        document.getElementById('instructorBox').classList.remove('hidden');
        document.getElementById('instructorName').textContent = course.instructorName;
        document.getElementById('instructorBio').textContent = course.instructorBio || '';
      }

      // ---- Auto video duration + watch-based progress (YouTube) ----
      function extractVideoId(url) {
        if (!url) return '';
        url = String(url);
        let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
        m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
        m = url.match(/([A-Za-z0-9_-]{11})/);
        return m ? m[1] : '';
      }
      function fmtClock(sec) {
        sec = Math.round(sec || 0);
        const h = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
        const pad = n => String(n).padStart(2, '0');
        return h > 0 ? (h + ':' + pad(mm) + ':' + pad(ss)) : (mm + ':' + pad(ss));
      }
      function fmtArabicDuration(sec) {
        sec = Math.round(sec || 0);
        if (sec <= 0) return '';
        const h = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
        const parts = [];
        if (h > 0) parts.push(h === 1 ? 'ساعة' : (h === 2 ? 'ساعتان' : (h <= 10 ? h + ' ساعات' : h + ' ساعة')));
        if (mm > 0) parts.push(mm === 1 ? 'دقيقة' : (mm === 2 ? 'دقيقتان' : (mm <= 10 ? mm + ' دقائق' : mm + ' دقيقة')));
        if (!parts.length) return sec + ' ثانية';
        return parts.join(' و ');
      }

      let watchData = {};
      try { watchData = JSON.parse(localStorage.getItem('samt_watch_' + course.id) || '{}'); } catch (e) { watchData = {}; }
      let ytPlayer = null;
      let watchTimer = null;

      const ytReady = new Promise(resolve => {
        if (window.YT && window.YT.Player) return resolve();
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          if (typeof prev === 'function') { try { prev(); } catch (e) {} }
          resolve();
        };
      });

      function saveWatch() {
        try { localStorage.setItem('samt_watch_' + course.id, JSON.stringify(watchData)); } catch (e) {}
      }

      function computeWatchProgress() {
        let totW = 0, totD = 0;
        allLessons.forEach(l => {
          const wd = watchData[l.id];
          if (wd && wd.d > 0) { totW += Math.min(wd.w || 0, wd.d); totD += wd.d; }
        });
        if (totD > 0) return Math.min(100, Math.round((totW / totD) * 100));
        return allLessons.length ? Math.round((completedLessons.length / allLessons.length) * 100) : 0;
      }

      function updateCompleteBtn(cl) {
        const isDone = completedLessons.includes(cl.id);
        toggleCompleteBtn.innerHTML = isDone
          ? '<i class="fa-solid fa-circle-check text-emerald-400"></i><span>تم الإكمال (اضغط للإلغاء)</span>'
          : '<i class="fa-regular fa-circle-check"></i><span>تحديد كمكتمل</span>';
        toggleCompleteBtn.classList.toggle('bg-emerald-500/20', isDone);
      }

      function showLessonDuration(sec) {
        const ld = document.getElementById('lessonDuration');
        if (!ld) return;
        if (sec > 0) {
          ld.innerHTML = '<i class="fa-regular fa-clock text-samt-cyan"></i><span>مدة الفيديو: ' + fmtArabicDuration(sec) + ' (' + fmtClock(sec) + ')</span>';
        } else {
          ld.innerHTML = '';
        }
      }

      function trackTick() {
        if (!ytPlayer || !ytPlayer.getDuration) return;
        const cl = allLessons[currentLessonIndex];
        if (!cl) return;
        const dur = ytPlayer.getDuration() || 0;
        const cur = ytPlayer.getCurrentTime ? (ytPlayer.getCurrentTime() || 0) : 0;
        if (dur > 0) {
          const wd = watchData[cl.id] || { w: 0, d: 0 };
          wd.d = dur;
          wd.w = Math.max(wd.w || 0, cur);
          watchData[cl.id] = wd;
          saveWatch();
          cl.durationSeconds = dur;
          cl.duration = fmtClock(dur);
          showLessonDuration(dur);
          if (wd.w / dur >= 0.9 && !completedLessons.includes(cl.id)) {
            completedLessons.push(cl.id);
            updateCompleteBtn(cl);
            renderSidebar();
          }
          updateProgress();
        }
      }

      function loadPlayer(videoUrl) {
        // امنع أي رابط فيديو خطير (javascript:/data: ...) من الوصول لـ iframe
        if (/^(?:javascript|data|vbscript|file):/i.test(String(videoUrl || '').trim())) videoUrl = '';
        const vid = extractVideoId(videoUrl);
        const host = document.getElementById('mainPlayer');
        if (!vid) {
          if (host && host.tagName !== 'IFRAME') {
            const f = document.createElement('iframe');
            f.id = 'mainPlayer';
            f.className = 'w-full h-full border-none';
            f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            f.setAttribute('allowfullscreen', '');
            f.src = videoUrl || '';
            host.replaceWith(f);
          } else if (host) {
            host.src = videoUrl || '';
          }
          return;
        }
        ytReady.then(() => {
          if (ytPlayer && ytPlayer.loadVideoById) {
            ytPlayer.loadVideoById(vid);
          } else {
            ytPlayer = new YT.Player('mainPlayer', {
              width: '100%', height: '100%', videoId: vid,
              playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
              events: {
                onReady: function () { setTimeout(trackTick, 700); },
                onStateChange: function (e) {
                  if (e.data === YT.PlayerState.PLAYING) {
                    if (watchTimer) clearInterval(watchTimer);
                    watchTimer = setInterval(trackTick, 1000);
                  } else {
                    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
                    trackTick();
                  }
                }
              }
            });
          }
        });
      }

      function updateProgress() {
        const percent = computeWatchProgress();
        progressPercent.textContent = percent + '%';
        progressBar.style.width = percent + '%';
        localStorage.setItem('samt_completed_' + course.id, JSON.stringify(completedLessons));

        // Show congrats message
        if (percent === 100 && course.congratsMessage) {
          if (!sessionStorage.getItem('congrats_shown_' + course.id)) {
            sessionStorage.setItem('congrats_shown_' + course.id, 'true');
            setTimeout(() => {
              if (window.SamtAuth && window.SamtAuth.toast) {
                window.SamtAuth.toast(course.congratsMessage, 'success');
              } else {
                alert(course.congratsMessage);
              }
            }, 500);
          }
        }
      }

      // Render Sidebar with Accordion Sections
      function renderSidebar() {
        let globalIdx = 0;
        sidebarContent.innerHTML = sections.map((sec, secIdx) => {
          const sectionLessons = sec.lectures || [];
          const completedInSection = sectionLessons.filter(l => completedLessons.includes(l.id)).length;
          const isExpanded = sectionLessons.some((l, i) => {
            const gIdx = sections.slice(0, secIdx).reduce((sum, s) => sum + (s.lectures || []).length, 0) + i;
            return gIdx === currentLessonIndex;
          });

          const lessonsHtml = sectionLessons.map((l, lIdx) => {
            const gIdx = sections.slice(0, secIdx).reduce((sum, s) => sum + (s.lectures || []).length, 0) + lIdx;
            const isDone = completedLessons.includes(l.id);
            const isActive = gIdx === currentLessonIndex;

            return `
              <div class="lesson-item p-3 rounded-xl border border-white/5 glass-card cursor-pointer flex items-center justify-between gap-2 ${isActive ? 'active' : ''}" onclick="selectLesson(${gIdx})">
                <div class="flex items-center gap-2.5">
                  <span class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0 ${isDone ? 'bg-emerald-500 text-black' : 'bg-white/10 text-slate-400'}">
                    ${isDone ? '<i class="fa-solid fa-check"></i>' : (gIdx + 1)}
                  </span>
                  <div>
                    <h4 class="text-[11px] sm:text-xs font-bold font-cairo leading-snug">${esc(l.title || 'بدون عنوان')}</h4>
                    <span class="text-[9px] text-slate-500 font-mono">${esc(l.duration || '')}</span>
                    ${l.freePreview ? '<span class="text-[9px] text-samt-blue font-bold mr-2"><i class="fa-solid fa-eye"></i> مجاني</span>' : ''}
                  </div>
                </div>
                <i class="fa-solid ${isActive ? 'fa-circle-play text-samt-cyan' : 'fa-play text-slate-500'} text-xs flex-shrink-0"></i>
              </div>
            `;
          }).join('');

          return `
            <div class="section-accordion rounded-xl overflow-hidden glass-card">
              <div class="section-header px-3.5 py-2.5 flex items-center justify-between gap-2 bg-black/20" onclick="toggleSection(this)">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-layer-group text-samt-cyan text-[10px]"></i>
                  <span class="text-[11px] font-bold font-cairo truncate">${esc(sec.title || 'قسم ' + (secIdx + 1))}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[9px] text-slate-500 font-mono">${completedInSection}/${sectionLessons.length}</span>
                  <i class="fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px] text-slate-400"></i>
                </div>
              </div>
              <div class="section-lectures space-y-1.5 p-2 ${isExpanded ? '' : 'hidden'}">
                ${lessonsHtml}
              </div>
            </div>
          `;
        }).join('');
      }

      window.toggleSection = function(headerEl) {
        const accordion = headerEl.closest('.section-accordion');
        const lectures = accordion.querySelector('.section-lectures');
        const icon = headerEl.querySelector('.fa-chevron-up, .fa-chevron-down');
        
        lectures.classList.toggle('hidden');
        if (icon) {
          icon.classList.toggle('fa-chevron-up');
          icon.classList.toggle('fa-chevron-down');
        }
      };

      window.selectLesson = function(index) {
        currentLessonIndex = index;
        const cl = allLessons[index];
        if (!cl) return;

        loadPlayer(cl.videoUrl);
        lessonTitle.textContent = cl.title || '';
        lessonDesc.textContent = cl.desc || cl.description || course.description || '';
        lessonCategory.textContent = (cl.sectionTitle ? cl.sectionTitle + ' — ' : '') + 'الدرس ' + (index + 1) + ' من ' + allLessons.length;

        const knownDur = (watchData[cl.id] && watchData[cl.id].d) || cl.durationSeconds || course.durationSeconds || 0;
        showLessonDuration(knownDur);

        updateCompleteBtn(cl);

        // Resources tab
        const resList = document.getElementById('resourcesList');
        const resources = cl.resources || [];
        if (resources.length > 0) {
          resList.innerHTML = resources.map(r => `
            <a href="${safeUrl(r.url)}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 p-3 rounded-xl glass-card border border-white/10 hover:border-samt-cyan text-xs font-bold">
              <i class="fa-solid fa-download text-samt-cyan"></i>
              <span>${esc(r.name)}</span>
              <i class="fa-solid fa-external-link text-slate-500 mr-auto text-[10px]"></i>
            </a>
          `).join('');
        } else {
          resList.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">لا توجد مرفقات لهذا الدرس.</p>';
        }

        // Switch to lesson tab
        switchInfoTab('lesson');

        renderSidebar();
        updateProgress();
      };

      toggleCompleteBtn.addEventListener('click', () => {
        const cl = allLessons[currentLessonIndex];
        if (completedLessons.includes(cl.id)) completedLessons = completedLessons.filter(id => id !== cl.id);
        else completedLessons.push(cl.id);
        selectLesson(currentLessonIndex);
      });

      // Show welcome message on first visit
      if (course.welcomeMessage && !sessionStorage.getItem('welcome_shown_' + course.id)) {
        sessionStorage.setItem('welcome_shown_' + course.id, 'true');
        setTimeout(() => {
          if (window.SamtAuth && window.SamtAuth.toast) {
            window.SamtAuth.toast(course.welcomeMessage, 'success');
          }
        }, 1000);
      }

      selectLesson(0);
    });
  </script>
</body>
</html>
