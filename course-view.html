<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغل الكورس والدروس | أكاديمية سمت SAMT</title>

  <!-- Google Fonts: Readex Pro & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            samt: {
              space: '#070A12',
              navy: '#0B132B',
              card: '#0E172E',
              cyan: '#00F5D4',
              blue: '#00BBF9',
              purple: '#7928CA',
              gold: '#FFB703',
              border: 'rgba(0, 245, 212, 0.18)'
            }
          },
          fontFamily: {
            readex: ['"Readex Pro"', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', '"Readex Pro"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Readex Pro', 'Cairo', sans-serif;
      background-color: #070A12;
      color: #FFFFFF;
    }
    .glass-card {
      background: rgba(14, 23, 46, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.14);
    }
    .lesson-item.active {
      background: rgba(0, 245, 212, 0.12);
      border-color: rgba(0, 245, 212, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#070A12]">

  <!-- Top Classroom Bar -->
  <header class="h-16 bg-[#090E1E] border-b border-white/10 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-4">
      <a href="./courses.html" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-2">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة لقائمة الكورسات</span>
      </a>
      <span class="text-slate-600">|</span>
      <h1 id="topCourseTitle" class="text-xs sm:text-sm font-bold text-white truncate max-w-xs sm:max-w-md font-cairo">جاري تحميل الكورس...</h1>
    </div>

    <!-- Live Overall Progress -->
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <div class="text-[10px] text-slate-400 font-bold">نسبة إنجازك</div>
        <div id="progressPercent" class="text-xs font-black text-samt-cyan font-mono">0%</div>
      </div>
      <div class="w-24 sm:w-32 h-2 bg-black/50 rounded-full overflow-hidden border border-white/10">
        <div id="progressBar" class="h-full bg-gradient-to-r from-samt-cyan to-samt-blue rounded-full transition-all" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- Classroom Workspace Grid -->
  <div class="flex-grow flex flex-col lg:flex-row max-w-7xl mx-auto w-full p-4 sm:p-6 gap-6">
    
    <!-- Main Video Player & Lesson Details (Center/Left) -->
    <div class="flex-grow flex flex-col space-y-4">
      
      <!-- Video Player Frame -->
      <div class="relative aspect-video rounded-2xl overflow-hidden glass-card shadow-2xl bg-black border border-white/15">
        <iframe id="mainPlayer" class="w-full h-full border-none" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Lesson Navigation & Controls -->
      <div class="glass-card rounded-2xl p-6 text-right space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
          <div>
            <span id="lessonCategory" class="text-xs font-extrabold text-samt-cyan uppercase">الدرس 1</span>
            <h2 id="lessonTitle" class="text-xl font-bold text-white mt-1 font-cairo">عنوان الدرس</h2>
          </div>
          <button id="toggleCompleteBtn" class="px-5 py-2.5 rounded-xl border border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/20 text-xs font-bold transition-all flex items-center gap-2">
            <i class="fa-solid fa-check"></i>
            <span>تحديد الدرس كمكتمل</span>
          </button>
        </div>

        <p id="lessonDesc" class="text-slate-300 text-sm leading-relaxed">
          وصف الدرس والملاحظات العملية...
        </p>

        <!-- Attachments & Resources Area -->
        <div id="attachmentsBox" class="pt-4 border-t border-white/10 hidden">
          <div class="text-xs font-bold text-samt-gold mb-2.5 flex items-center gap-2">
            <i class="fa-solid fa-paperclip"></i>
            <span>الملفات والمرفقات الخاصة بهذا الدرس:</span>
          </div>
          <div id="attachmentsList" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

    </div>

    <!-- Sidebar: Course Syllabus / Lessons List (Right) -->
    <div class="w-full lg:w-96 flex-shrink-0">
      <div class="glass-card rounded-2xl p-5 sticky top-24 space-y-4 text-right">
        
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h3 class="text-sm font-bold text-white font-cairo">محتوى الدورة والدروس</h3>
          <span id="lessonsCount" class="text-xs text-slate-400 font-mono font-bold">3 دروس</span>
        </div>

        <!-- Lessons Items List Container -->
        <div id="lessonsList" class="space-y-2.5 max-h-[600px] overflow-y-auto pr-1"></div>

      </div>
    </div>

  </div>

  <!-- Central Data Script -->
  <script src="./assets/js/courses-data.js"></script>

  <!-- Interactive Classroom Engine -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Get Course ID from URL (e.g. ?id=course-01)
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('id') || 'course-01';

      // 2. Find Course Data
      const courses = window.AgentProData?.courses || [];
      const course = courses.find(c => c.id === courseId) || courses[0];

      if (!course) {
        alert('لم يتم العثور على الكورس المطلوب');
        window.location.href = './courses.html';
        return;
      }

      // 3. Populate default lessons if not present in schema
      const lessons = course.lessons || [
        {
          id: 'l1',
          title: course.title + ' (الجزء الأول)',
          duration: '04:15',
          videoUrl: course.videoUrl,
          desc: course.description
        },
        {
          id: 'l2',
          title: 'التطبيق العملي والإعدادات المتقدمة',
          duration: '05:30',
          videoUrl: course.videoUrl,
          desc: 'شرح وتطبيق عملي خطوة بخطوة داخل بيئة النظام.'
        },
        {
          id: 'l3',
          title: 'حل المشكلات وأفضل الممارسات',
          duration: '03:45',
          videoUrl: course.videoUrl,
          desc: 'نصائح لزيادة كفاءة وسرعة الوكيل وتفادي الأخطاء الشائعة.'
        }
      ];

      let currentLessonIndex = 0;
      let completedLessons = [];

      try {
        completedLessons = JSON.parse(localStorage.getItem(`samt_completed_${course.id}`) || '[]');
      } catch(e) { completedLessons = []; }

      // Elements
      const topTitle = document.getElementById('topCourseTitle');
      const player = document.getElementById('mainPlayer');
      const lessonTitle = document.getElementById('lessonTitle');
      const lessonDesc = document.getElementById('lessonDesc');
      const lessonCategory = document.getElementById('lessonCategory');
      const lessonsList = document.getElementById('lessonsList');
      const lessonsCount = document.getElementById('lessonsCount');
      const progressPercent = document.getElementById('progressPercent');
      const progressBar = document.getElementById('progressBar');
      const toggleCompleteBtn = document.getElementById('toggleCompleteBtn');
      const attachmentsBox = document.getElementById('attachmentsBox');
      const attachmentsList = document.getElementById('attachmentsList');

      topTitle.textContent = course.title;
      lessonsCount.textContent = `${lessons.length} دروس`;

      function updateProgress() {
        const percent = Math.round((completedLessons.length / lessons.length) * 100);
        progressPercent.textContent = `${percent}%`;
        progressBar.style.width = `${percent}%`;
        try {
          localStorage.setItem(`samt_completed_${course.id}`, JSON.stringify(completedLessons));
        } catch(e) {}
      }

      function renderLessons() {
        lessonsList.innerHTML = lessons.map((l, idx) => {
          const isDone = completedLessons.includes(l.id);
          const isActive = idx === currentLessonIndex;
          return `
            <div class="lesson-item p-3.5 rounded-xl border border-white/10 glass-card cursor-pointer transition-all flex items-center justify-between gap-3 ${isActive ? 'active' : ''}" onclick="selectLesson(${idx})">
              <div class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${isDone ? 'bg-emerald-500 text-black' : 'bg-white/10 text-slate-400'}">
                  ${isDone ? '<i class="fa-solid fa-check"></i>' : (idx + 1)}
                </span>
                <div>
                  <h4 class="text-xs sm:text-sm font-bold text-white font-cairo">${l.title}</h4>
                  <span class="text-[10px] text-slate-400 font-mono">${l.duration}</span>
                </div>
              </div>
              <i class="fa-solid ${isActive ? 'fa-circle-play text-samt-cyan' : 'fa-play text-slate-500 text-xs'}"></i>
            </div>
          `;
        }).join('');
      }

      window.selectLesson = function(index) {
        currentLessonIndex = index;
        const currentLesson = lessons[index];

        player.src = currentLesson.videoUrl;
        lessonTitle.textContent = currentLesson.title;
        lessonDesc.textContent = currentLesson.desc || course.description;
        lessonCategory.textContent = `الدرس ${index + 1} من ${lessons.length}`;

        // Toggle complete button status
        const isDone = completedLessons.includes(currentLesson.id);
        if (isDone) {
          toggleCompleteBtn.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i><span>تم إكمال هذا الدرس (اضغط للإلغاء)</span>';
          toggleCompleteBtn.classList.add('bg-emerald-500/20');
        } else {
          toggleCompleteBtn.innerHTML = '<i class="fa-regular fa-circle-check"></i><span>تحديد الدرس كمكتمل</span>';
          toggleCompleteBtn.classList.remove('bg-emerald-500/20');
        }

        // Attachments
        if (course.attachments && course.attachments.length > 0) {
          attachmentsBox.classList.remove('hidden');
          attachmentsList.innerHTML = course.attachments.map(a => `
            <a href="${a.url}" class="px-3 py-1.5 rounded-lg bg-samt-card text-xs font-bold text-slate-300 hover:text-samt-cyan border border-white/10 flex items-center gap-2 transition-all">
              <i class="fa-solid fa-download text-samt-cyan text-xs"></i>
              <span>${a.name}</span>
            </a>
          `).join('');
        } else {
          attachmentsBox.classList.add('hidden');
        }

        renderLessons();
        updateProgress();
      };

      toggleCompleteBtn.addEventListener('click', () => {
        const currentLesson = lessons[currentLessonIndex];
        if (completedLessons.includes(currentLesson.id)) {
          completedLessons = completedLessons.filter(id => id !== currentLesson.id);
        } else {
          completedLessons.push(currentLesson.id);
        }
        selectLesson(currentLessonIndex);
      });

      // Initial load first lesson
      selectLesson(0);
    });
  </script>

</body>
</html>
